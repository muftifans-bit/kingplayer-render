<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>البث المباشر الخاص بشبكة سمكة نت اللاسلكية</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at top right,#ffd70022,transparent 35%),
    radial-gradient(circle at bottom left,#00d4ff22,transparent 35%),
    linear-gradient(135deg,#050505,#121212 45%,#050505);
}

.header{
  padding:22px 14px;
  text-align:center;
  background:linear-gradient(135deg,#101010,#1d1d1d);
  border-bottom:1px solid #ffffff18;
}

.header h1{
  margin:0;
  color:#ffd700;
  font-size:22px;
  line-height:1.5;
}

.header p{
  margin:8px 0 0;
  color:#ddd;
  font-size:13px;
}

.container{
  width:min(1100px,100%);
  margin:auto;
  padding:14px;
}

.player-card{
  position:sticky;
  top:0;
  z-index:10;
  overflow:hidden;
  border-radius:22px;
  background:linear-gradient(180deg,#171717,#070707);
  border:1px solid #ffffff20;
  box-shadow:0 20px 50px #000c;
}

.player-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  background:linear-gradient(90deg,#202020,#111);
}

#channelName{
  color:#ffd700;
  font-weight:bold;
  font-size:15px;
}

.live-badge{
  background:#e60023;
  color:#fff;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
}

.video-wrap{
  background:#000;
}

video{
  width:100%;
  height:44vh;
  max-height:520px;
  min-height:240px;
  display:block;
  background:#000;
}

#status{
  padding:10px 14px;
  color:#bbb;
  font-size:13px;
  background:#0d0d0d;
  border-top:1px solid #ffffff12;
}

.player-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:10px;
  background:#111;
}

.action-btn{
  border:1px solid #ffffff20;
  border-radius:14px;
  padding:12px;
  color:#fff;
  background:#181818;
  font-weight:bold;
  cursor:pointer;
}

.action-btn:hover{
  border-color:#ffd700;
}

.tools{
  margin:16px 0 12px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}

.search{
  width:100%;
  border:1px solid #ffffff20;
  outline:none;
  border-radius:16px;
  padding:14px;
  color:#fff;
  background:#111;
  font-size:15px;
}

.counter{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:105px;
  border-radius:16px;
  background:#ffd700;
  color:#111;
  font-weight:bold;
  font-size:14px;
}

.channels{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:10px;
  padding-bottom:30px;
}

button.channel{
  min-height:74px;
  border:none;
  border-radius:18px;
  padding:12px;
  color:#fff;
  background:linear-gradient(135deg,#1a1a1a,#101010);
  border:1px solid #ffffff18;
  text-align:right;
  cursor:pointer;
  transition:.25s;
}

button.channel:hover{
  transform:translateY(-3px);
  border-color:#ffd70088;
}

button.channel.active{
  background:linear-gradient(135deg,#ffd700,#ffb300);
  color:#000;
}

.ch-icon{
  font-size:22px;
  display:block;
  margin-bottom:6px;
}

.ch-name{
  font-weight:bold;
  font-size:14px;
  line-height:1.5;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:25px;
  grid-column:1/-1;
  line-height:2;
}

@media(max-width:700px){
  .player-actions{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){
  .header h1{
    font-size:18px;
  }

  video{
    height:36vh;
  }

  .channels{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>📡 البث المباشر الخاص بشبكة سمكة نت اللاسلكية</h1>
  <p>مشاهدة مباشرة بجودة عالية عبر شبكة سمكة نت</p>
</div>

<div class="container">

  <div class="player-card">

    <div class="player-top">
      <div id="channelName">اختر قناة لبدء المشاهدة</div>
      <div class="live-badge">● LIVE</div>
    </div>

    <div class="video-wrap">
      <video
        id="video"
        controls
        autoplay
        playsinline
        muted
      ></video>
    </div>

    <div id="status">جاري تحميل القنوات...</div>

    <div class="player-actions">
      <button class="action-btn" onclick="reloadCurrent()">🔄 إعادة تحميل</button>
      <button class="action-btn" onclick="openMX()">📱 MX Player</button>
      <button class="action-btn" onclick="openVLC()">▶ VLC</button>
      <button class="action-btn" onclick="fullScreen()">⛶ ملء الشاشة</button>
    </div>

  </div>

  <div class="tools">

    <input
      class="search"
      id="search"
      placeholder="🔎 ابحث عن قناة..."
    >

    <div class="counter" id="counter">
      0 قناة
    </div>

  </div>

  <div class="channels" id="channels"></div>

</div>

<script>

const BACKEND_URL="";

const video=document.getElementById("video");
const list=document.getElementById("channels");
const title=document.getElementById("channelName");
const statusBox=document.getElementById("status");
const searchBox=document.getElementById("search");
const counter=document.getElementById("counter");

let allChannels=[];

let currentChannel=null;
let currentBtn=null;

let hls=null;
let tsPlayer=null;

let lastTime=0;
let stuckSince=null;
let lastReloadAt=0;
let monitorTimer=null;


function status(text){
  statusBox.innerText=text;
}


function api(path){
  return `${BACKEND_URL}${path}`;
}


function proxied(url){
  return api(
    `/api/stream/proxy?url=${encodeURIComponent(url)}`
  );
}


function clearPlayer(){

  if(hls){

    try{
      hls.destroy();
    }catch(error){}

    hls=null;
  }

  if(tsPlayer){

    try{
      tsPlayer.unload();
    }catch(error){}

    try{
      tsPlayer.detachMediaElement();
    }catch(error){}

    try{
      tsPlayer.destroy();
    }catch(error){}

    tsPlayer=null;
  }

  try{
    video.pause();
  }catch(error){}

  video.removeAttribute("src");

  try{
    video.load();
  }catch(error){}
}


function parseM3U(text){

  const lines=text
    .replace(/^\uFEFF/,"")
    .split(/\r?\n/);

  const channels=[];

  let name="قناة";

  for(const line of lines){

    const value=line.trim();

    if(!value){
      continue;
    }

    if(value.startsWith("#EXTINF")){

      const index=value.lastIndexOf(",");

      name=
        index>=0
          ? value.slice(index+1).trim()
          : "قناة";

    }else if(!value.startsWith("#")){

      channels.push({
        name:name || "قناة",
        url:value
      });

      name="قناة";
    }
  }

  return channels;
}


async function loadChannels(){

  status("⏳ جاري تحميل القنوات...");

  counter.innerText="0 قناة";

  try{

    const response=await fetch(
      api("/api/m3u/default"),
      {
        cache:"no-store"
      }
    );

    console.log(
      "M3U STATUS:",
      response.status
    );

    if(!response.ok){

      throw new Error(
        "HTTP "+response.status
      );
    }

    const text=
      await response.text();

    allChannels=
      parseM3U(text);

    if(!allChannels.length){

      throw new Error(
        "قائمة القنوات فارغة"
      );
    }

    renderChannels(
      allChannels
    );

    status(
      "✅ تم تحميل "+
      allChannels.length+
      " قناة بنجاح"
    );

  }catch(error){

    console.error(
      "LOAD CHANNEL ERROR:",
      error
    );

    allChannels=[];

    counter.innerText="0 قناة";

    status(
      "❌ فشل تحميل القنوات: "+
      error.message
    );

    list.innerHTML=
      '<div class="empty">'+
      '❌ تعذر تحميل قائمة القنوات'+
      '<br><br>'+
      'المسار: /api/m3u/default'+
      '<br>'+
      'الخطأ: '+
      error.message+
      '</div>';
  }
}


function renderChannels(channels=allChannels){

  list.innerHTML="";

  counter.innerText=
    channels.length+" قناة";

  if(!channels.length){

    list.innerHTML=
      '<div class="empty">'+
      'لا توجد قنوات للعرض'+
      '</div>';

    return;
  }

  channels.forEach(channel=>{

    const button=
      document.createElement("button");

    button.className="channel";

    if(
      currentChannel &&
      currentChannel.url===channel.url
    ){
      button.classList.add("active");
    }

    const icon=
      document.createElement("span");

    icon.className="ch-icon";
    icon.innerText="📺";

    const channelName=
      document.createElement("span");

    channelName.className="ch-name";
    channelName.innerText=channel.name;

    button.appendChild(icon);
    button.appendChild(channelName);

    button.onclick=()=>{

      playChannel(
        channel,
        button
      );
    };

    list.appendChild(button);
  });
}


async function detectType(url){

  try{

    const response=await fetch(
      api(
        `/api/stream/probe?url=${encodeURIComponent(url)}`
      )
    );

    if(!response.ok){
      throw new Error(
        "Probe HTTP "+response.status
      );
    }

    const data=
      await response.json();

    return data.type==="ts"
      ? "ts"
      : "hls";

  }catch(error){

    console.error(
      "PROBE ERROR:",
      error
    );

    return url
      .toLowerCase()
      .includes(".m3u8")
        ? "hls"
        : "ts";
  }
}


async function playChannel(channel,button){

  currentChannel=channel;
  currentBtn=button;

  localStorage.setItem(
    "last_channel_url",
    channel.url
  );

  document
    .querySelectorAll("button.channel")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  if(button){
    button.classList.add("active");
  }

  title.innerText=
    "📺 "+channel.name;

  clearPlayer();

  status(
    "⏳ جاري تجهيز البث..."
  );

  const type=
    await detectType(channel.url);

  const url=
    proxied(channel.url);

  console.log(
    "CHANNEL:",
    channel.name
  );

  console.log(
    "TYPE:",
    type
  );

  console.log(
    "PROXY URL:",
    url
  );

  if(type==="hls"){

    playHLS(url);

  }else{

    playTS(url);
  }

  startMonitor();
}


function playHLS(url){

  if(
    window.Hls &&
    Hls.isSupported()
  ){

    hls=new Hls({

      enableWorker:true,

      lowLatencyMode:false,

      liveDurationInfinity:true,

      liveSyncDurationCount:8,

      liveMaxLatencyDurationCount:30,

      maxBufferLength:90,

      maxMaxBufferLength:180,

      backBufferLength:60,

      manifestLoadingTimeOut:30000,

      fragLoadingTimeOut:45000,

      levelLoadingTimeOut:30000,

      manifestLoadingMaxRetry:15,

      fragLoadingMaxRetry:15,

      levelLoadingMaxRetry:15,

      manifestLoadingRetryDelay:2000,

      fragLoadingRetryDelay:2000,

      levelLoadingRetryDelay:2000
    });

    hls.loadSource(url);

    hls.attachMedia(video);

    hls.on(
      Hls.Events.MANIFEST_PARSED,
      ()=>{

        video
          .play()
          .then(()=>{

            status(
              "✅ البث يعمل الآن"
            );

          })
          .catch(()=>{

            status(
              "اضغط تشغيل من شاشة الفيديو"
            );
          });
      }
    );


    hls.on(
      Hls.Events.ERROR,
      (event,data)=>{

        console.error(
          "HLS ERROR:",
          data
        );

        if(!data.fatal){
          return;
        }

        if(
          data.type===
          Hls.ErrorTypes.NETWORK_ERROR
        ){

          status(
            "ضعف بالشبكة... محاولة إصلاح"
          );

          try{
            hls.startLoad();
          }catch(error){}

          return;
        }

        if(
          data.type===
          Hls.ErrorTypes.MEDIA_ERROR
        ){

          status(
            "إصلاح الفيديو..."
          );

          try{
            hls.recoverMediaError();
          }catch(error){}

          return;
        }

        softReload();
      }
    );

  }else if(
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ){

    video.src=url;

    video
      .play()
      .then(()=>{

        status(
          "✅ البث يعمل الآن"
        );

      })
      .catch(()=>{

        status(
          "اضغط تشغيل من شاشة الفيديو"
        );
      });

  }else{

    status(
      "هذا الجهاز لا يدعم HLS"
    );
  }
}


function playTS(url){

  if(
    window.mpegts &&
    mpegts.getFeatureList()
      .mseLivePlayback
  ){

    tsPlayer=
      mpegts.createPlayer(
        {
          type:"mpegts",
          isLive:true,
          url:url
        },
        {
          enableStashBuffer:true,

          stashInitialSize:
            1024*1024*2,

          liveBufferLatencyChasing:
            false
        }
      );

    tsPlayer.attachMediaElement(
      video
    );

    tsPlayer.load();

    video
      .play()
      .then(()=>{

        status(
          "✅ البث يعمل الآن"
        );

      })
      .catch(()=>{

        status(
          "اضغط تشغيل من شاشة الفيديو"
        );
      });


    tsPlayer.on(
      mpegts.Events.ERROR,
      (
        errorType,
        errorDetail,
        errorInfo
      )=>{

        console.error(
          "MPEGTS ERROR:",
          errorType,
          errorDetail,
          errorInfo
        );

        status(
          "⚠️ ضعف في البث... جاري الانتظار"
        );
      }
    );

  }else{

    video.src=url;

    video
      .play()
      .then(()=>{

        status(
          "✅ البث يعمل الآن"
        );

      })
      .catch(()=>{

        status(
          "اضغط تشغيل من شاشة الفيديو"
        );
      });
  }
}


function startMonitor(){

  if(monitorTimer){

    clearInterval(
      monitorTimer
    );
  }

  lastTime=0;

  stuckSince=null;

  monitorTimer=setInterval(()=>{

    if(
      !currentChannel ||
      video.paused
    ){
      return;
    }

    const now=
      Date.now();

    if(
      video.currentTime===
      lastTime
    ){

      if(!stuckSince){

        stuckSince=now;
      }

      const stuckFor=
        now-stuckSince;

      if(
        stuckFor>25000 &&
        hls
      ){

        status(
          "⏳ البث متوقف مؤقتًا... محاولة إصلاح"
        );

        try{
          hls.startLoad();
        }catch(error){}
      }

      if(
        stuckFor>60000
      ){

        softReload();
      }

    }else{

      stuckSince=null;

      lastTime=
        video.currentTime;

      status(
        "✅ البث يعمل الآن"
      );
    }

  },5000);
}


function softReload(){

  const now=
    Date.now();

  if(
    now-lastReloadAt<
    90000
  ){

    status(
      "⏳ البث ضعيف... ننتظر قبل إعادة المحاولة"
    );

    return;
  }

  lastReloadAt=now;

  if(currentChannel){

    status(
      "🔄 إعادة اتصال هادئة..."
    );

    playChannel(
      currentChannel,
      currentBtn
    );
  }
}


function reloadCurrent(){

  lastReloadAt=0;

  if(currentChannel){

    playChannel(
      currentChannel,
      currentBtn
    );

  }else{

    status(
      "اختر قناة أولاً"
    );
  }
}


function fullScreen(){

  if(video.requestFullscreen){

    video.requestFullscreen();

  }else if(
    video.webkitRequestFullscreen
  ){

    video.webkitRequestFullscreen();
  }
}


function openMX(){

  if(!currentChannel){

    status(
      "اختر قناة أولاً"
    );

    return;
  }

  const url=
    proxied(
      currentChannel.url
    );

  window.location.href=
    "intent:"+
    url.replace(/^https?:/,"")+
    "#Intent;scheme=http;package=com.mxtech.videoplayer.ad;type=video/*;end";
}


function openVLC(){

  if(!currentChannel){

    status(
      "اختر قناة أولاً"
    );

    return;
  }

  const url=
    proxied(
      currentChannel.url
    );

  window.location.href=
    "intent:"+
    url.replace(/^https?:/,"")+
    "#Intent;scheme=http;package=org.videolan.vlc;type=video/*;end";
}


searchBox.addEventListener(
  "input",
  ()=>{

    const query=
      searchBox.value
        .trim()
        .toLowerCase();

    const filtered=
      allChannels.filter(
        channel=>
          channel.name
            .toLowerCase()
            .includes(query)
      );

    renderChannels(
      filtered
    );
  }
);


loadChannels();

</script>

</body>
</html>
