<script>
(() => {
  'use strict';

  /******************************************************************
   * Endpoints (MUST NOT CHANGE)
   ******************************************************************/
  const API = Object.freeze({
    m3uDefault: '/api/m3u/default',
    probe: '/api/stream/probe',
    proxy: '/api/stream/proxy'
  });

  /******************************************************************
   * Small Utilities
   ******************************************************************/
  const $ = (sel, root=document) => root.querySelector(sel);
  const clamp = (n,a,b) => Math.max(a, Math.min(b, n));

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function proxyUrl(u){
    if (!u) return '';
    if (u.startsWith(API.proxy)) return u;
    return `${API.proxy}?url=${encodeURIComponent(u)}`;
  }

  function resolveAgainstBase(maybeRelativeUrl, baseUrl){
    try{ return new URL(maybeRelativeUrl, baseUrl).toString(); }
    catch{ return maybeRelativeUrl; }
  }

  function isProbablyHls(url){
    const u = String(url||'').toLowerCase();
    return u.includes('.m3u8') || u.includes('m3u8');
  }
  function isProbablyMpegTs(url){
    const u = String(url||'').toLowerCase();
    return u.includes('.ts') || u.includes('mpegts') || u.startsWith('udp:') || u.startsWith('rtp:');
  }

  function fmtMbps(bitsPerSec){
    if (!Number.isFinite(bitsPerSec) || bitsPerSec <= 0) return '--';
    const mbps = bitsPerSec / 1e6;
    return mbps >= 10 ? `${mbps.toFixed(1)} Mbps` : `${mbps.toFixed(2)} Mbps`;
  }
  function fmtKbps(bitsPerSec){
    if (!Number.isFinite(bitsPerSec) || bitsPerSec <= 0) return '--';
    const kbps = bitsPerSec / 1000;
    return kbps >= 1000 ? `${(kbps/1000).toFixed(2)} Mbps` : `${kbps.toFixed(0)} kbps`;
  }
  function fmtMs(ms){
    if (!Number.isFinite(ms) || ms <= 0) return '--';
    return `${Math.round(ms)} ms`;
  }

  // Arabic-friendly normalization (diacritics stripping + case fold)
  function normalizeSearch(s){
    const v = String(s ?? '').toLowerCase().normalize('NFKD');
    // remove diacritics/marks + tatweel
    return v
      .replace(/[\u0640]/g,'')
      .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g,'')
      .replace(/\p{M}/gu,'')
      .trim();
  }

  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function waitForLibs(timeoutMs=8000){
    const t0 = performance.now();
    while (performance.now() - t0 < timeoutMs){
      if (window.Hls && window.mpegts) return true;
      await wait(40);
    }
    return false;
  }

  /******************************************************************
   * ToastManager
   ******************************************************************/
  class ToastManager{
    constructor(container){
      this.el = container;
      this._lastAt = 0;
    }

    show(message, type='ok', ttl=2600){
      try{
        const now = Date.now();
        // small anti-spam: if too many toasts quickly, extend TTL but keep readable
        const spacing = now - this._lastAt;
        this._lastAt = now;
        const finalTtl = spacing < 350 ? Math.min(4200, ttl + 900) : ttl;

        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = message;
        this.el.appendChild(t);

        // animate in
        requestAnimationFrame(() => t.classList.add('show'));

        setTimeout(() => {
          t.classList.remove('show');
          setTimeout(() => t.remove(), 240);
        }, finalTtl);
      }catch(err){
        console.warn('Toast error', err);
      }
    }
  }

  /******************************************************************
   * StorageManager
   ******************************************************************/
  class StorageManager{
    constructor(prefix='iptv_v2'){
      this.prefix = prefix;
    }
    _k(k){ return `${this.prefix}:${k}`; }

    getStr(k, fallback=''){
      try{
        const v = localStorage.getItem(this._k(k));
        return v ?? fallback;
      }catch{ return fallback; }
    }
    setStr(k, v){
      try{ localStorage.setItem(this._k(k), String(v)); }catch{}
    }
    getJSON(k, fallback){
      try{
        const raw = localStorage.getItem(this._k(k));
        if (!raw) return fallback;
        return JSON.parse(raw);
      }catch{ return fallback; }
    }
    setJSON(k, v){
      try{ localStorage.setItem(this._k(k), JSON.stringify(v)); }catch{}
    }

    getLastChannelId(){ return this.getStr('lastChannelId',''); }
    setLastChannelId(id){ this.setStr('lastChannelId', id || ''); }

    getVolume(){ return clamp(Number(this.getStr('volume','0.7')), 0, 1); }
    setVolume(v){ this.setStr('volume', String(clamp(Number(v),0,1))); }

    getMuted(){ return this.getStr('muted','0') === '1'; }
    setMuted(m){ this.setStr('muted', m ? '1' : '0'); }

    getFavorites(){ return new Set(this.getJSON('favorites', [])); }
    setFavorites(set){ this.setJSON('favorites', Array.from(set)); }

    getRecent(){ return this.getJSON('recent', []); }
    setRecent(arr){ this.setJSON('recent', arr); }
    pushRecent(channelId, limit=40){
      if (!channelId) return;
      const arr = this.getRecent().filter(x => x !== channelId);
      arr.unshift(channelId);
      this.setRecent(arr.slice(0, limit));
    }

    // Quality preference:
    // { mode: 'auto' | 'height', height?: number }
    getQualityPref(){
      const q = this.getJSON('qualityPref', { mode:'auto' });
      if (!q || typeof q !== 'object') return { mode:'auto' };
      if (q.mode === 'height' && Number.isFinite(q.height)) return { mode:'height', height: Number(q.height) };
      return { mode:'auto' };
    }
    setQualityPref(pref){
      const v = (pref?.mode === 'height' && Number.isFinite(pref.height))
        ? { mode:'height', height: Number(pref.height) }
        : { mode:'auto' };
      this.setJSON('qualityPref', v);
    }
  }

  /******************************************************************
   * ChannelManager
   ******************************************************************/
  class ChannelManager{
    constructor(){
      this.channels = [];
      this.byId = new Map();
      this._lastM3UTextHash = '';
    }

    async load(){
      const res = await fetch(API.m3uDefault, { cache:'no-store' });
      if (!res.ok) throw new Error(`Failed to load M3U: ${res.status}`);
      const text = await res.text();

      this.channels = this.parseM3U(text);
      this.byId.clear();
      for (const ch of this.channels) this.byId.set(ch.id, ch);

      return this.channels;
    }

    parseM3U(text){
      const lines = String(text||'').replace(/\r/g,'').split('\n').map(l => l.trim()).filter(Boolean);
      const out = [];
      let pending = null;

      for (let i=0; i<lines.length; i++){
        const line = lines[i];

        if (line.startsWith('#EXTINF')){
          pending = this._parseExtInf(line);
          continue;
        }
        if (line.startsWith('#')) continue;

        if (pending){
          const url = line;
          const name = pending.name || pending.attrs['tvg-name'] || 'Channel';
          const logo = pending.attrs['tvg-logo'] || '';
          const group = pending.attrs['group-title'] || 'Other';
          const id = this._makeId(name, url, group);

          const searchKey = normalizeSearch(`${name} ${group} ${pending.attrs['tvg-name']||''}`);

          out.push({
            id, name, url, logo, group,
            tvgName: pending.attrs['tvg-name'] || '',
            rawAttrs: pending.attrs,
            searchKey
          });
          pending = null;
        }
      }

      // Default sort: group then A→Z
      out.sort((a,b)=>{
        const g = a.group.localeCompare(b.group, 'ar');
        if (g !== 0) return g;
        return a.name.localeCompare(b.name, 'ar');
      });

      return out;
    }

    _parseExtInf(extinfLine){
      const idxComma = extinfLine.indexOf(',');
      const left = idxComma >= 0 ? extinfLine.slice(0, idxComma) : extinfLine;
      const name = idxComma >= 0 ? extinfLine.slice(idxComma+1).trim() : '';

      const attrs = {};
      const re = /([\w-]+)="([^"]*)"/g;
      let m;
      while ((m = re.exec(left)) !== null) attrs[m[1]] = m[2];

      return { name, attrs };
    }

    _makeId(name, url, group){
      // stable deterministic id (FNV-1a)
      const base = `${group}::${name}::${url}`;
      let h = 2166136261;
      for (let i=0; i<base.length; i++){
        h ^= base.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return `ch_${(h>>>0).toString(16)}`;
    }

    getById(id){ return this.byId.get(id) || null; }

    getIndexById(id){
      for (let i=0; i<this.channels.length; i++){
        if (this.channels[i].id === id) return i;
      }
      return -1;
    }
  }

  /******************************************************************
   * UIManager
   * - List rendering with reuse (no per-item listeners, event delegation)
   * - Smooth overlays
   * - Freeze frame capture/hide
   ******************************************************************/
  class UIManager{
    constructor({ toast }){
      this.toast = toast;

      // Header
      this.searchInput = $('#searchInput');
      this.tabAll = $('#tabAll');
      this.tabFav = $('#tabFav');
      this.tabRecent = $('#tabRecent');

      this.netDot = $('#netDot');
      this.netText = $('#netText');
      this.bwText = $('#bwText');
      this.rttText = $('#rttText');
      this.qText = $('#qText');

      // Sidebar
      this.btnReload = $('#btnReload');
      this.sortSel = $('#sortSel');
      this.listEl = $('#list');
      this.chCount = $('#chCount');
      this.visCount = $('#visCount');

      // Player
      this.playerWrap = $('#playerWrap');
      this.video = $('#video');

      this.freezeCanvas = $('#freezeCanvas');
      this._freezeCtx = this.freezeCanvas.getContext('2d', { alpha:false, desynchronized:true });

      this.overlay = $('#overlay');
      this.ovTitle = $('#ovTitle');
      this.ovMsg = $('#ovMsg');

      this.controls = $('#controls');
      this.btnPlay = $('#btnPlay');
      this.icoPlay = $('#icoPlay');
      this.icoPause = $('#icoPause');

      this.btnMute = $('#btnMute');
      this.icoVolOn = $('#icoVolOn');
      this.icoVolOff = $('#icoVolOff');

      this.volRange = $('#volRange');
      this.volVal = $('#volVal');

      this.btnQuality = $('#btnQuality');
      this.qMenu = $('#qMenu');

      this.btnPiP = $('#btnPiP');
      this.btnFull = $('#btnFull');

      // Overlays/badges
      this.qualityBadge = $('#qualityBadge');
      this.typeBadge = $('#typeBadge');
      this.channelMini = $('#channelMini');
      this.miniLogo = $('#miniLogo');
      this.miniName = $('#miniName');
      this.miniGroup = $('#miniGroup');

      // Bottom info
      this.infoLogo = $('#infoLogo');
      this.infoTitle = $('#infoTitle');
      this.infoSub = $('#infoSub');
      this.btnFavToggle = $('#btnFavToggle');
      this.favToggleText = $('#favToggleText');

      // Stats
      this.stBuffer = $('#stBuffer');
      this.stBitrate = $('#stBitrate');
      this.stFps = $('#stFps');
      this.stDrop = $('#stDrop');
      this.stRes = $('#stRes');
      this.stDelay = $('#stDelay');
      this.stType = $('#stType');

      // State
      this.currentTab = 'all';
      this.currentQuery = '';
      this.sortMode = 'group_az';
      this.activeChannelId = '';

      // List node cache (reused DOM nodes)
      this.nodeById = new Map();
      this._currentListSignature = '';

      // Controls auto-hide (desktop like Smarters)
      this._autoHideTimer = null;
      this._lastPointerAt = 0;

      // Fast filtering scheduler
      this._filterRaf = 0;

      // List keyboard navigation
      this._visibleIds = [];
      this._focusIndex = 0;
    }

    initControlsAutohide(){
      const onActivity = () => {
        this._lastPointerAt = performance.now();
        this.showControls();
        if (this._autoHideTimer) clearTimeout(this._autoHideTimer);
        this._autoHideTimer = setTimeout(() => {
          // do not hide if focused on controls
          const ae = document.activeElement;
          const shouldKeep = ae && (this.controls.contains(ae) || this.qMenu.contains(ae));
          if (!shouldKeep) this.hideControls();
        }, 2200);
      };

      // Passive events for performance
      this.playerWrap.addEventListener('mousemove', onActivity, { passive:true });
      this.playerWrap.addEventListener('touchstart', onActivity, { passive:true });
      this.playerWrap.addEventListener('touchmove', onActivity, { passive:true });
      this.playerWrap.addEventListener('pointermove', onActivity, { passive:true });

      // Always show on focus in
      this.controls.addEventListener('focusin', () => this.showControls(), { passive:true });
    }

    showControls(){ this.controls.classList.remove('hide'); }
    hideControls(){ this.controls.classList.add('hide'); }

    setPlayState(isPlaying){
      this.icoPlay.style.display = isPlaying ? 'none' : '';
      this.icoPause.style.display = isPlaying ? '' : 'none';
    }
    setMuteState(muted){
      this.icoVolOn.style.display = muted ? 'none' : '';
      this.icoVolOff.style.display = muted ? '' : 'none';
    }
    setVolumeUI(v){
      const vv = clamp(Number(v), 0, 1);
      const p = Math.round(vv * 100);
      this.volRange.value = String(p);
      this.volVal.textContent = `${p}%`;
    }

    setNetworkUI({ online, bwBits, rttMs }){
      const on = !!online;
      this.netDot.classList.toggle('online', on);
      this.netDot.classList.toggle('offline', !on);
      this.netText.textContent = on ? 'Online' : 'Offline';
      this.bwText.textContent = bwBits ? fmtMbps(bwBits) : '--';
      this.rttText.textContent = rttMs ? fmtMs(rttMs) : '--';
    }

    setQualityText(txt){
      const t = txt || 'Auto';
      this.qText.textContent = t;
      this.qualityBadge.textContent = t;
    }

    setTypeText(t){
      const v = t || '—';
      this.typeBadge.textContent = v;
      this.stType.textContent = v;
    }

    showOverlay(title, msg){
      this.ovTitle.textContent = title || 'جاري التحضير...';
      this.ovMsg.textContent = msg || '';
      this.overlay.classList.add('show');
    }
    hideOverlay(){
      this.overlay.classList.remove('show');
    }

    /** Freeze Frame:
     *  - Used when we MUST clear/detach MSE (e.g., channel change, hard reconnect)
     *  - Prevents black screen/flicker without duplicating frames.
     */
    captureFreezeFrame(){
      try{
        const v = this.video;
        if (!v || v.readyState < 2 || v.videoWidth <= 0 || v.videoHeight <= 0) return false;

        // Ensure canvas matches video frame size (not CSS size)
        if (this.freezeCanvas.width !== v.videoWidth) this.freezeCanvas.width = v.videoWidth;
        if (this.freezeCanvas.height !== v.videoHeight) this.freezeCanvas.height = v.videoHeight;

        this._freezeCtx.drawImage(v, 0, 0, this.freezeCanvas.width, this.freezeCanvas.height);
        return true;
      }catch{
        return false;
      }
    }
    showFreeze(){
      this.freezeCanvas.classList.add('show');
    }
    hideFreeze(){
      this.freezeCanvas.classList.remove('show');
      // Do not clear canvas aggressively (keeps last still if quickly toggled)
    }

    renderLogoHTML(logoUrl, name, size=44){
      const safeName = String(name || '').trim() || 'C';
      const letter = safeName[0]?.toUpperCase() || 'C';

      if (logoUrl){
        // Logo URLs often already public. If broken -> graceful fallback
        return `<img src="${escapeHtml(logoUrl)}" alt="${escapeHtml(safeName)}" loading="lazy" decoding="async"
          onerror="this.remove(); this.parentElement.innerHTML='<div class=\\'ph\\'>${escapeHtml(letter)}</div>';">`;
      }
      return `<div class="ph">${escapeHtml(letter)}</div>`;
    }

    setChannelInfo(ch, isFav){
      if (!ch){
        this.infoLogo.innerHTML = '';
        this.infoTitle.textContent = '—';
        this.infoSub.textContent = '—';
        this.favToggleText.textContent = 'إضافة للمفضلة';
        this.channelMini.style.display = 'none';
        return;
      }

      this.infoLogo.innerHTML = this.renderLogoHTML(ch.logo, ch.name, 46);
      this.infoTitle.textContent = ch.name || '—';
      this.infoSub.textContent = ch.group ? `المجموعة: ${ch.group}` : '—';
      this.favToggleText.textContent = isFav ? 'إزالة من المفضلة' : 'إضافة للمفضلة';

      // top mini (Smarters-like)
      this.channelMini.style.display = '';
      this.miniLogo.innerHTML = this.renderLogoHTML(ch.logo, ch.name, 34);
      this.miniName.textContent = ch.name || '—';
      this.miniGroup.textContent = ch.group || '—';
    }

    setActiveInList(id){
      this.activeChannelId = id || '';
      // Update only previous + current to avoid full list re-render
      const prev = this.listEl.querySelector('.item.active');
      if (prev) prev.classList.remove('active');

      const el = this.listEl.querySelector(`.item[data-id="${CSS.escape(this.activeChannelId)}"]`);
      if (el){
        el.classList.add('active');
        el.scrollIntoView({ block:'nearest' });
      }
    }

    updateStats({ bufferText, bitrateText, fpsText, droppedText, resText, delayText, typeText }){
      if (bufferText != null) this.stBuffer.textContent = bufferText;
      if (bitrateText != null) this.stBitrate.textContent = bitrateText;
      if (fpsText != null) this.stFps.textContent = fpsText;
      if (droppedText != null) this.stDrop.textContent = droppedText;
      if (resText != null) this.stRes.textContent = resText;
      if (delayText != null) this.stDelay.textContent = delayText;
      if (typeText != null) this.stType.textContent = typeText;
    }

    // Quality menu
    buildQualityMenu({ levels, currentText, activeMode }){
      // activeMode: { mode:'auto' } or { mode:'height', height }
      try{
        this.qMenu.innerHTML = '';
        const frag = document.createDocumentFragment();

        // Auto
        frag.appendChild(this._qualityItem({
          key: 'auto',
          text: 'Auto',
          tag: 'ABR',
          active: activeMode?.mode !== 'height'
        }));

        // Sort levels by height desc (4K -> 360p)
        const sorted = [...levels].sort((a,b) => (b.height||0) - (a.height||0));
        for (const lv of sorted){
          const h = lv.height || 0;
          const label = h ? `${h}p` : `Level ${lv.levelIndex}`;
          const tag = lv.bitrate ? fmtKbps(lv.bitrate) : '';
          frag.appendChild(this._qualityItem({
            key: `h_${h || lv.levelIndex}`,
            levelIndex: lv.levelIndex,
            height: h,
            text: label,
            tag,
            active: activeMode?.mode === 'height' && Number(activeMode.height) === Number(h)
          }));
        }

        this.qMenu.appendChild(frag);
      }catch(err){
        console.warn('Quality menu error', err);
      }
    }

    _qualityItem({ key, text, tag, active, levelIndex, height }){
      const el = document.createElement('div');
      el.className = `mi${active ? ' active' : ''}`;
      el.setAttribute('role', 'menuitem');
      el.dataset.qkey = String(key);
      if (Number.isFinite(levelIndex)) el.dataset.level = String(levelIndex);
      if (Number.isFinite(height)) el.dataset.height = String(height);
      el.innerHTML = `<span>${escapeHtml(text)}</span><span class="tag">${escapeHtml(tag || '')}</span>`;
      return el;
    }

    showQualityMenu(){ this.qMenu.classList.add('show'); }
    hideQualityMenu(){ this.qMenu.classList.remove('show'); }
    toggleQualityMenu(){
      this.qMenu.classList.toggle('show');
    }

    // Sidebar list rendering with reuse:
    // We rebuild group wrappers + reorder nodes, but we reuse existing channel nodes (no duplicated listeners).
    ensureChannelNodes(channels, favoritesSet){
      for (const ch of channels){
        if (this.nodeById.has(ch.id)) continue;

        const item = document.createElement('div');
        item.className = 'item';
        item.tabIndex = 0;
        item.dataset.id = ch.id;
        item.dataset.group = ch.group || '';
        item.dataset.key = ch.searchKey || normalizeSearch(`${ch.name} ${ch.group}`);

        item.innerHTML = `
          <div class="logo">${this.renderLogoHTML(ch.logo, ch.name, 44)}</div>
          <div class="meta">
            <div class="n">${escapeHtml(ch.name || '')}</div>
            <div class="g">${escapeHtml(ch.group || '')}</div>
          </div>
          <div class="actions">
            <button class="fav ${favoritesSet.has(ch.id) ? 'on' : ''}" type="button" data-fav="1" title="Favorite">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 17.3 6.8 20l1-5.7L3.6 10.6l5.8-.8L12 4.5l2.6 5.3 5.8.8-4.2 3.7 1 5.7L12 17.3Z"
                  fill="${favoritesSet.has(ch.id) ? 'rgba(255,202,58,.85)' : 'rgba(255,255,255,.14)'}"
                  stroke="rgba(255,255,255,.78)" stroke-width="1.1" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        `;

        this.nodeById.set(ch.id, item);
      }
    }

    updateFavoriteVisual(id, on){
      const node = this.nodeById.get(id);
      if (!node) return;
      const btn = node.querySelector('.fav');
      if (!btn) return;
      btn.classList.toggle('on', !!on);
      // Update star fill (small)
      const path = btn.querySelector('path');
      if (path){
        path.setAttribute('fill', on ? 'rgba(255,202,58,.85)' : 'rgba(255,255,255,.14)');
      }
    }

    // Build grouped DOM view using reused item nodes
    renderChannelListView({ channels, favoritesSet, recentIds, tab, query, sortMode, activeId }){
      const q = normalizeSearch(query || '');
      const isFavTab = tab === 'fav';
      const isRecentTab = tab === 'recent';

      // Determine list of channels by tab
      let list = channels;

      if (isFavTab){
        list = list.filter(ch => favoritesSet.has(ch.id));
      } else if (isRecentTab){
        // Keep recent order
        const map = new Map(list.map(ch => [ch.id, ch]));
        list = (recentIds || []).map(id => map.get(id)).filter(Boolean);
      }

      // Sorting
      if (!isRecentTab){
        if (sortMode === 'az'){
          list = [...list].sort((a,b)=> a.name.localeCompare(b.name,'ar'));
        }else if (sortMode === 'za'){
          list = [...list].sort((a,b)=> b.name.localeCompare(a.name,'ar'));
        }else{
          // group_az default
          list = [...list].sort((a,b)=>{
            const g = (a.group||'').localeCompare((b.group||''),'ar');
            if (g !== 0) return g;
            return (a.name||'').localeCompare((b.name||''),'ar');
          });
        }
      }

      // Filter query (fast)
      if (q){
        list = list.filter(ch => (ch.searchKey || '').includes(q));
      }

      // Update counters
      this.visCount.textContent = String(list.length);

      // Build view: group wrappers unless recent tab (Smarters-like recent list)
      const frag = document.createDocumentFragment();
      this._visibleIds = [];

      if (isRecentTab){
        const g = document.createElement('div');
        g.className = 'group';
        const h = document.createElement('div');
        h.className = 'group-h';
        h.innerHTML = `<div class="name">Recent</div><div class="count">${list.length}</div>`;
        g.appendChild(h);

        for (const ch of list){
          const node = this.nodeById.get(ch.id);
          if (!node) continue;
          node.classList.toggle('active', ch.id === activeId);
          g.appendChild(node);
          this._visibleIds.push(ch.id);
        }
        frag.appendChild(g);
      }else{
        let currentGroup = null;
        let groupEl = null;
        let groupCount = 0;

        const flushGroup = () => {
          if (!groupEl) return;
          // update count
          const c = groupEl.querySelector('.group-h .count');
          if (c) c.textContent = String(groupCount);
          if (groupCount > 0) frag.appendChild(groupEl);
          groupEl = null;
          groupCount = 0;
        };

        for (const ch of list){
          const grp = ch.group || 'Other';
          if (grp !== currentGroup){
            flushGroup();
            currentGroup = grp;

            groupEl = document.createElement('div');
            groupEl.className = 'group';
            const head = document.createElement('div');
            head.className = 'group-h';
            head.innerHTML = `<div class="name">${escapeHtml(grp)}</div><div class="count">0</div>`;
            groupEl.appendChild(head);
          }

          const node = this.nodeById.get(ch.id);
          if (!node) continue;
          node.classList.toggle('active', ch.id === activeId);
          groupEl.appendChild(node);
          groupCount++;
          this._visibleIds.push(ch.id);
        }

        flushGroup();
      }

      // Replace list children (reusing nodes)
      this.listEl.replaceChildren(frag);

      // Ensure active is in view
      if (activeId){
        const activeNode = this.listEl.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
        if (activeNode) activeNode.scrollIntoView({ block:'nearest' });
      }

      // Reset focus index to active (TV/remote friendly)
      if (activeId){
        const idx = this._visibleIds.indexOf(activeId);
        this._focusIndex = idx >= 0 ? idx : 0;
      }else{
        this._focusIndex = 0;
      }
    }

    focusNext(){
      if (!this._visibleIds.length) return null;
      this._focusIndex = clamp(this._focusIndex + 1, 0, this._visibleIds.length - 1);
      const id = this._visibleIds[this._focusIndex];
      this._focusId(id);
      return id;
    }
    focusPrev(){
      if (!this._visibleIds.length) return null;
      this._focusIndex = clamp(this._focusIndex - 1, 0, this._visibleIds.length - 1);
      const id = this._visibleIds[this._focusIndex];
      this._focusId(id);
      return id;
    }
    _focusId(id){
      const node = this.listEl.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
      if (node){
        node.focus({ preventScroll:true });
        node.scrollIntoView({ block:'nearest' });
      }
    }

    getVisibleIds(){ return this._visibleIds.slice(); }
  }

  /******************************************************************
   * NetworkMonitor
   ******************************************************************/
  class NetworkMonitor{
    constructor({ ui, toast, player }){
      this.ui = ui;
      this.toast = toast;
      this.player = player;

      this._timer = null;
      this._lastOnline = navigator.onLine;

      this._onOnline = () => {
        if (!this._lastOnline){
          this.toast.show('عاد الإنترنت. سيتم استئناف البث تلقائياً.', 'ok', 2400);
        }
        this._lastOnline = true;
        this.player.onInternetRestored();
      };
      this._onOffline = () => {
        if (this._lastOnline){
          this.toast.show('انقطع الإنترنت. سيتم إعادة الاتصال عند العودة.', 'warn', 3200);
        }
        this._lastOnline = false;
      };
    }

    start(){
      window.addEventListener('online', this._onOnline);
      window.addEventListener('offline', this._onOffline);
      this._timer = setInterval(() => this.tick(), 1000);
      this.tick();
    }

    stop(){
      window.removeEventListener('online', this._onOnline);
      window.removeEventListener('offline', this._onOffline);
      if (this._timer) clearInterval(this._timer);
      this._timer = null;
    }

    tick(){
      try{
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const downlinkMbps = conn && Number.isFinite(conn.downlink) ? conn.downlink : 0;
        const rtt = conn && Number.isFinite(conn.rtt) ? conn.rtt : 0;

        // Prefer player measured bandwidth estimate if available
        const playerBwBits = this.player.getBandwidthEstimateBits();
        const navBwBits = downlinkMbps > 0 ? downlinkMbps * 1e6 : 0;
        const bwBits = playerBwBits || navBwBits;

        this.ui.setNetworkUI({ online: navigator.onLine, bwBits, rttMs: rtt || 0 });
      }catch(err){
        console.warn('Network tick error', err);
      }
    }
  }

  /******************************************************************
   * PlayerManager
   * - Single video element reused
   * - HLS with proxy-loader to proxy all internal requests
   * - Smart reconnect ladder (no destroy early)
   * - Prevent black/flicker: freeze frame only when needed (detach/destroy)
   ******************************************************************/
  class PlayerManager{
    constructor({ video, ui, toast, storage }){
      this.video = video;
      this.ui = ui;
      this.toast = toast;
      this.storage = storage;

      this.hls = null;
      this.ts = null;
      this.playerType = '—'; // HLS / HLS Native / MPEGTS
      this.currentChannel = null;

      // Quality state
      this.levels = [];
      this._lastQualityText = 'Auto';
      this._qualityPref = this.storage.getQualityPref();

      // Playback/frames stats
      this._statsTimer = null;
      this._bandwidthBits = 0;

      // FPS tracker
      this._fps = 0;
      this._fpsFrames = 0;
      this._fpsLastTs = 0;
      this._rvfc = null; // requestVideoFrameCallback handler

      // Stall/reconnect monitor
      this._reconnect = new ConnectionMonitor({ player: this, ui, toast });

      // Video events (kept stable)
      this._bindVideoEvents();

      // Initial UI state
      this.ui.setPlayState(false);
      this.ui.setMuteState(this.video.muted);

      // Do not force muted by default; use stored preference
      this.applyStoredVolume();

      // Auto-hide controls
      this.ui.initControlsAutohide();
    }

    applyStoredVolume(){
      const vol = this.storage.getVolume();
      const muted = this.storage.getMuted();
      this.video.volume = vol;
      this.video.muted = muted;
      this.ui.setVolumeUI(vol);
      this.ui.setMuteState(muted);
    }

    _bindVideoEvents(){
      // Important: do NOT clear src on minor errors; keep last frame visible.
      this.video.addEventListener('play', () => this.ui.setPlayState(true), { passive:true });
      this.video.addEventListener('pause', () => this.ui.setPlayState(false), { passive:true });
      this.video.addEventListener('volumechange', () => {
        try{
          this.storage.setVolume(this.video.volume);
          this.storage.setMuted(this.video.muted);
          this.ui.setVolumeUI(this.video.volume);
          this.ui.setMuteState(this.video.muted);
        }catch{}
      }, { passive:true });

      // On playing: hide overlays + hide freeze
      this.video.addEventListener('playing', () => {
        this.ui.hideOverlay();
        this.ui.hideFreeze();
        this.ui.setPlayState(true);
        this._reconnect.onPlaying();
      }, { passive:true });

      // waiting/stalled: let ConnectionMonitor decide ladder; keep frame visible
      this.video.addEventListener('waiting', () => this._reconnect.onSignal('waiting'), { passive:true });
      this.video.addEventListener('stalled', () => this._reconnect.onSignal('stalled'), { passive:true });
      this.video.addEventListener('error', () => this._reconnect.onSignal('video_error'), { passive:true });

      // Track time progress for stall detection
      this.video.addEventListener('timeupdate', () => this._reconnect.onTimeUpdate(), { passive:true });
    }

    getBandwidthEstimateBits(){
      // Prefer Hls estimate
      if (this.hls && Number.isFinite(this.hls.bandwidthEstimate) && this.hls.bandwidthEstimate > 0){
        return this.hls.bandwidthEstimate;
      }
      // mpegts.js stats
      if (this.ts && typeof this.ts.getStatisticsInfo === 'function'){
        try{
          const s = this.ts.getStatisticsInfo();
          const speedKBps = Number(s?.speed || 0);
          if (speedKBps > 0) return speedKBps * 1024 * 8;
        }catch{}
      }
      return this._bandwidthBits || 0;
    }

    getBufferedSeconds(){
      try{
        const v = this.video;
        if (!v || !v.buffered || v.buffered.length === 0) return 0;
        const t = v.currentTime || 0;
        for (let i=0; i<v.buffered.length; i++){
          const s = v.buffered.start(i);
          const e = v.buffered.end(i);
          if (t >= s && t <= e) return Math.max(0, e - t);
        }
        const e = v.buffered.end(v.buffered.length - 1);
        return Math.max(0, e - t);
      }catch{ return 0; }
    }

    getLiveDelaySeconds(){
      // Use seekable end as "live edge" approximation
      try{
        const v = this.video;
        if (!v || !v.seekable || v.seekable.length === 0) return 0;
        const end = v.seekable.end(v.seekable.length - 1);
        const ct = v.currentTime || 0;
        return Math.max(0, end - ct);
      }catch{ return 0; }
    }

    getResolutionText(){
      const w = this.video.videoWidth || 0;
      const h = this.video.videoHeight || 0;
      return (w && h) ? `${w}x${h}` : '--';
    }

    getDroppedFrames(){
      try{
        // Chrome/Edge
        if (typeof this.video.getVideoPlaybackQuality === 'function'){
          const q = this.video.getVideoPlaybackQuality();
          const dropped = Number(q?.droppedVideoFrames || 0);
          const total = Number(q?.totalVideoFrames || 0);
          return { dropped, total };
        }
        // Safari fallback
        const dropped = Number(this.video.webkitDroppedFrameCount || 0);
        const total = Number(this.video.webkitDecodedFrameCount || 0);
        return { dropped, total };
      }catch{
        return { dropped: 0, total: 0 };
      }
    }

    startStats(){
      this.stopStats();
      this._statsTimer = setInterval(() => this._tickStats(), 700);
      this._tickStats();
      this._startFpsTracker();
    }

    stopStats(){
      if (this._statsTimer) clearInterval(this._statsTimer);
      this._statsTimer = null;
      this._stopFpsTracker();
    }

    _tickStats(){
      try{
        const bufSec = this.getBufferedSeconds();
        const bufPct = clamp((bufSec / 15) * 100, 0, 100);
        const bufferText = `${bufPct.toFixed(0)}% (${bufSec.toFixed(1)}s)`;

        // Bitrate: show level bitrate (manual) or bandwidth estimate
        let bitrateBits = 0;

        if (this.hls){
          const auto = this.hls.autoLevelEnabled;
          const idx = this.hls.currentLevel;
          const lv = this.hls.levels?.[idx];
          // if manual, show exact level bitrate; else show estimate
          if (!auto && lv?.bitrate) bitrateBits = lv.bitrate;
          bitrateBits = bitrateBits || this.hls.bandwidthEstimate || 0;
          if (this.hls.bandwidthEstimate) this._bandwidthBits = this.hls.bandwidthEstimate;
        } else if (this.ts){
          bitrateBits = this.getBandwidthEstimateBits();
        }

        const bitrateText = bitrateBits ? fmtKbps(bitrateBits) : '--';
        const resText = this.getResolutionText();
        const delaySec = this.getLiveDelaySeconds();
        const delayText = delaySec ? `${delaySec.toFixed(1)}s` : '--';

        const { dropped, total } = this.getDroppedFrames();
        const droppedText = total ? `${dropped}/${total}` : `${dropped}`;

        this.ui.updateStats({
          bufferText,
          bitrateText,
          fpsText: this._fps ? `${this._fps.toFixed(0)}` : '--',
          droppedText,
          resText,
          delayText,
          typeText: this.playerType
        });
      }catch(err){
        console.warn('Stats tick error', err);
      }
    }

    _startFpsTracker(){
      this._stopFpsTracker();
      this._fps = 0;
      this._fpsFrames = 0;
      this._fpsLastTs = performance.now();

      // Best: requestVideoFrameCallback (Chrome/Edge/Android WebView modern)
      if (this.video && typeof this.video.requestVideoFrameCallback === 'function'){
        const loop = (now, meta) => {
          this._fpsFrames++;
          const dt = now - this._fpsLastTs;
          if (dt >= 1000){
            this._fps = (this._fpsFrames * 1000) / dt;
            this._fpsFrames = 0;
            this._fpsLastTs = now;
          }
          this._rvfc = this.video.requestVideoFrameCallback(loop);
        };
        this._rvfc = this.video.requestVideoFrameCallback(loop);
        return;
      }

      // Fallback: approximate with timeupdate (not great) -> leave as '--'
      this._fps = 0;
    }

    _stopFpsTracker(){
      try{
        if (this._rvfc && typeof this.video.cancelVideoFrameCallback === 'function'){
          this.video.cancelVideoFrameCallback(this._rvfc);
        }
      }catch{}
      this._rvfc = null;
    }

    async probeType(url){
      // Must use /api/stream/probe (do not change)
      try{
        const res = await fetch(`${API.probe}?url=${encodeURIComponent(url)}`, { cache:'no-store' });
        if (res.ok){
          const data = await res.json().catch(()=>null);
          const t = String(data?.type || data?.stream_type || data?.format || '').toLowerCase();
          if (t.includes('hls') || t.includes('m3u8')) return 'hls';
          if (t.includes('mpegts') || t.includes('ts')) return 'mpegts';
        }
      }catch{}
      // heuristic fallback
      if (isProbablyHls(url)) return 'hls';
      if (isProbablyMpegTs(url)) return 'mpegts';
      return 'hls';
    }

    _createProxyLoaderClass(basePlaylistUrl){
      // Proxy every request through /api/stream/proxy while resolving relative URLs
      const BaseLoader = Hls.DefaultConfig.loader;
      const base = basePlaylistUrl;
      return class ProxyLoader extends BaseLoader{
        constructor(config){ super(config); load(context, config, callbacks){
  try{
    // إذا كان الرابط يمر عبر البروكسي بالفعل فلا تعيد تغليفه
    if (!context.url.includes(API.proxy)) {
      const abs = resolveAgainstBase(context.url, base);
      context.url = proxyUrl(abs);
    }
  } catch (e) {
    console.error(e);
  }

  return super.load(context, config, callbacks);
}
      };
    }

    _bestHlsConfig(basePlaylistUrl){
      const ProxyLoader = this._createProxyLoaderClass(basePlaylistUrl);

      // Hls.js 1.5 supports loadPolicy objects (progressive/retry fine-tuning)
      const policy = {
        default: {
          maxTimeToFirstByteMs: 9000,
          timeoutMs: 20000,
          maxRetry: 8,
          retryDelayMs: 700,
          maxRetryDelayMs: 8000
        }
      };
      const fragPolicy = {
        default: {
          maxTimeToFirstByteMs: 12000,
          timeoutMs: 24000,
          maxRetry: 10,
          retryDelayMs: 700,
          maxRetryDelayMs: 10000
        }
      };

      return {
        // Live + low latency
        lowLatencyMode: true,
        liveSyncDurationCount: 2,
        liveMaxLatencyDurationCount: 5,
        maxLiveSyncPlaybackRate: 1.35,

        // Smart buffer (dynamic-ish)
        backBufferLength: 30,
        maxBufferLength: 26,
        maxMaxBufferLength: 60,
        maxBufferHole: 0.5,
        maxBufferSize: 36 * 1000 * 1000,

        // ABR tuning
        startLevel: -1,
        capLevelToPlayerSize: true,
        abrEwmaFastLive: 3,
        abrEwmaSlowLive: 9,
        abrEwmaDefaultEstimate: 1_200_000,
        abrBandWidthFactor: 0.90,
        abrBandWidthUpFactor: 0.75,
        abrMaxWithRealBitrate: true,

        // Reliability / recovery
        enableWorker: true,
        enableSoftwareAES: true,
        nudgeOffset: 0.1,
        nudgeMaxRetry: 8,
        appendErrorMaxRetry: 6,

        // Reduce UI flicker & keep stable playback
        // (we avoid re-creating <video>; Hls instance handles MSE)
        progressive: true, // if supported by version; harmless otherwise

        // Load policies
        manifestLoadPolicy: policy,
        playlistLoadPolicy: policy,
        fragLoadPolicy: fragPolicy,

        // Proxy all requests
        loader: ProxyLoader,

        // Debug off
        debug: false
      };
    }

    _bindHlsEvents(){
      if (!this.hls) return;

      // Manifest parsed -> extract quality levels + apply stored preference
      this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
        try{
          const lvls = this.hls.levels || [];
          this.levels = lvls.map((l, idx) => ({
            levelIndex: idx,
            height: Number(l.height || 0),
            bitrate: Number(l.bitrate || 0)
          }));

          // Build menu
          this.ui.buildQualityMenu({
            levels: this.levels,
            currentText: this._lastQualityText,
            activeMode: this._qualityPref
          });

          // Apply stored quality (height) if possible
          if (this._qualityPref?.mode === 'height'){
            const desired = Number(this._qualityPref.height);
            const matchIdx = this._findLevelIndexByHeight(desired);
            if (matchIdx >= 0){
              this._setHlsLevelIndex(matchIdx, { silent:true });
              this.toast.show(`تم تطبيق الجودة المحفوظة: ${desired}p`, 'ok', 1800);
            }else{
              // fallback to auto if not found
              this._setAutoQuality({ silent:true });
            }
          }else{
            this._setAutoQuality({ silent:true });
          }

          this._syncQualityText();
        }catch(err){
          console.warn('MANIFEST_PARSED error', err);
        }
      });

      this.hls.on(Hls.Events.LEVEL_SWITCHED, () => {
        this._syncQualityText();
      });

      this.hls.on(Hls.Events.FRAG_LOADED, () => {
        try{
          const be = this.hls.bandwidthEstimate || 0;
          if (be > 0) this._bandwidthBits = be;
        }catch{}
      });

      // Smart error -> do NOT destroy early. Feed ConnectionMonitor signals.
      this.hls.on(Hls.Events.ERROR, (evt, data) => {
        try{
          if (!data) return;
          const t = data.type || '';
          const d = data.details || '';
          const fatal = !!data.fatal;

          // Send to ConnectionMonitor (it owns ladder + escalation)
          this._reconnect.onHlsError({ type:t, details:d, fatal });

          // For fatal media error, attempt immediate recover (first ladder step)
          if (fatal && t === Hls.ErrorTypes.MEDIA_ERROR){
            this._reconnect.requestImmediate('recoverMediaError');
          }
          if (fatal && t === Hls.ErrorTypes.NETWORK_ERROR){
            this._reconnect.requestImmediate('startLoad');
          }
        }catch(err){
          console.warn('HLS error handler failed', err);
        }
      });
    }

    _syncQualityText(){
      if (!this.hls){
        this.ui.setQualityText('—');
        this.ui.qualityBadge.textContent = '—';
        return;
      }
      const auto = this.hls.autoLevelEnabled;
      const idx = this.hls.currentLevel;
      const lv = this.hls.levels?.[idx];
      if (auto){
        const t = lv?.height ? `Auto (${lv.height}p)` : 'Auto';
        this._lastQualityText = t;
        this.ui.setQualityText(t);
        return;
      }
      const t = lv?.height ? `${lv.height}p` : `L${idx}`;
      this._lastQualityText = t;
      this.ui.setQualityText(t);
    }

    _findLevelIndexByHeight(height){
      if (!this.hls || !this.hls.levels) return -1;
      const h = Number(height);
      let best = -1;
      // Exact match
      for (let i=0; i<this.hls.levels.length; i++){
        if (Number(this.hls.levels[i]?.height || 0) === h) return i;
      }
      // If no exact match, pick nearest lower
      let nearest = -1;
      let nearestDiff = Infinity;
      for (let i=0; i<this.hls.levels.length; i++){
        const hi = Number(this.hls.levels[i]?.height || 0);
        if (!hi) continue;
        if (hi <= h){
          const diff = h - hi;
          if (diff < nearestDiff){
            nearestDiff = diff;
            nearest = i;
          }
        }
      }
      return nearest;
    }

    _setAutoQuality({ silent=false } = {}){
      if (!this.hls) return;
      this.hls.currentLevel = -1;
      this.hls.loadLevel = -1;
      this.hls.nextLevel = -1;
      this._qualityPref = { mode:'auto' };
      this.storage.setQualityPref(this._qualityPref);
      this._syncQualityText();
      if (!silent) this.toast.show('تم التبديل إلى Auto Quality', 'ok', 1800);
      this.ui.buildQualityMenu({ levels: this.levels, activeMode: this._qualityPref });
    }

    _setHlsLevelIndex(idx, { silent=false } = {}){
      if (!this.hls) return;
      const i = Number(idx);
      if (!Number.isInteger(i) || i < 0 || i >= (this.hls.levels?.length || 0)) return;

      // Switch without reloading page/video element
      this.hls.currentLevel = i;
      this.hls.loadLevel = i;
      this.hls.nextLevel = i;

      const h = Number(this.hls.levels[i]?.height || 0);
      if (h){
        this._qualityPref = { mode:'height', height: h };
        this.storage.setQualityPref(this._qualityPref);
      }else{
        this._qualityPref = { mode:'auto' };
        this.storage.setQualityPref(this._qualityPref);
      }

      this._syncQualityText();
      if (!silent) this.toast.show(`تم تغيير الجودة إلى ${h ? h+'p' : 'Manual'}`, 'ok', 1800);
      this.ui.buildQualityMenu({ levels: this.levels, activeMode: this._qualityPref });
    }

    async playChannel(channel, { reason='user' } = {}){
      if (!channel) return;

      // UI: show overlay but KEEP last frame (do not clear video until necessary)
      this.ui.showOverlay('جاري فتح القناة...', reason === 'resume' ? 'استئناف آخر قناة' : 'تحضير البث المباشر');
      this.currentChannel = channel;

      // Always apply stored volume before play
      this.applyStoredVolume();

      // For channel change: capture freeze BEFORE destroying players to avoid flicker
      // Freeze shown only for channel changes (not normal reconnect).
      const freezeOk = this.ui.captureFreezeFrame();
      if (freezeOk) this.ui.showFreeze();

      // Hard stop previous players safely (this WILL clear MSE; freeze prevents black)
      await this._stopPlayersHard({ keepVideoElement:true });

      // Determine type via probe (must not change endpoint)
      const type = await this.probeType(channel.url);
      if (type === 'mpegts'){
        await this._playMpegTs(channel.url);
      }else{
        await this._playHls(channel.url);
      }

      // Start monitors/stats
      this._reconnect.reset();
      this._reconnect.start();

      this.startStats();
      // Try play
      await this._safePlay();

      // Overlay will hide on 'playing'
      // If autoplay blocked, overlay stays with instructions
    }

    async _safePlay(){
      try{
        const p = this.video.play();
        if (p && typeof p.then === 'function') await p;
      }catch{
        // Autoplay may be blocked
        this.ui.showOverlay('اضغط تشغيل', 'تم منع التشغيل التلقائي. اضغط زر التشغيل.');
        this.ui.setPlayState(false);
      }
    }

    async _playHls(originalUrl){
      // Prefer Hls.js if supported
      if (window.Hls && Hls.isSupported()){
        this.playerType = 'HLS';
        this.ui.setTypeText('HLS');

        const cfg = this._bestHlsConfig(originalUrl);
        this.hls = new Hls(cfg);
        this._bindHlsEvents();

        // Important: Keep source as original; loader proxies internal requests.
        this.hls.loadSource(proxyUrl(originalUrl));
        this.hls.attachMedia(this.video);

        // Hint UI quality
        this.ui.setQualityText('Auto');
        this.ui.buildQualityMenu({ levels: [], activeMode: this._qualityPref });

        return;
      }

      // Native HLS (Safari): use proxy URL (CORS-safe)
      if (this.video.canPlayType('application/vnd.apple.mpegurl')){
        this.playerType = 'HLS Native';
        this.ui.setTypeText('HLS Native');

        this.video.src = proxyUrl(originalUrl);
        this.ui.setQualityText('Auto');
        this.levels = [];
        this.ui.buildQualityMenu({ levels: [], activeMode: { mode:'auto' } });
        return;
      }

      throw new Error('HLS not supported');
    }

    async _playMpegTs(originalUrl){
      this.playerType = 'MPEGTS';
      this.ui.setTypeText('MPEGTS');
      this.ui.setQualityText('—');
      this.levels = [];
      this.ui.buildQualityMenu({ levels: [], activeMode: { mode:'auto' } });

      const url = proxyUrl(originalUrl);

      // mpegts.js low-latency tuning
      if (window.mpegts && mpegts.getFeatureList?.().mseLivePlayback){
        const config = {
          type: 'mpegts',
          url,
          isLive: true,
          cors: true
        };

        const options = {
          enableStashBuffer: false,        // lower latency
          stashInitialSize: 128,
          lazyLoad: false,
          autoCleanupSourceBuffer: true,
          autoCleanupMaxBackwardDuration: 30,
          autoCleanupMinBackwardDuration: 20,
          fixAudioTimestampGap: true
        };

        this.ts = mpegts.createPlayer(config, options);
        this._bindMpegTsEvents();
        this.ts.attachMediaElement(this.video);
        this.ts.load();
        return;
      }

      // Fallback: try direct video src via proxy
      this.video.src = url;
    }

    _bindMpegTsEvents(){
      if (!this.ts) return;
      try{
        this.ts.on(mpegts.Events.ERROR, (type, detail) => {
          // Feed reconnect ladder
          this._reconnect.onSignal('mpegts_error');
        });
        this.ts.on(mpegts.Events.LOADING_COMPLETE, () => {
          // might happen if stream ended unexpectedly; attempt reconnect
          this._reconnect.onSignal('loading_complete');
        });
      }catch(err){
        console.warn('mpegts events bind error', err);
      }
    }

    // HARD stop when switching channels / last ladder steps
    async _stopPlayersHard({ keepVideoElement=true } = {}){
      // stop reconnect/stats
      this._reconnect.stop();
      this.stopStats();

      // HLS
      if (this.hls){
        try{ this.hls.stopLoad(); }catch{}
        try{ this.hls.detachMedia(); }catch{}
        try{ this.hls.destroy(); }catch{}
        this.hls = null;
      }

      // MPEGTS
      if (this.ts){
        try{ this.ts.pause(); }catch{}
        try{ this.ts.unload(); }catch{}
        try{ this.ts.detachMediaElement(); }catch{}
        try{ this.ts.destroy(); }catch{}
        this.ts = null;
      }

      // Clear src ONLY on channel change/hard reset.
      // This can clear the last frame; freeze canvas should be shown when we do this.
      if (keepVideoElement){
        try{
          this.video.pause();
          this.video.removeAttribute('src');
          this.video.load();
        }catch{}
      }
    }

    togglePlay(){
      try{
        if (this.video.paused) this._safePlay();
        else this.video.pause();
      }catch{}
    }

    toggleMute(){
      try{
        this.video.muted = !this.video.muted;
        this.storage.setMuted(this.video.muted);
        this.ui.setMuteState(this.video.muted);
      }catch{}
    }

    setVolume(v){
      try{
        this.video.volume = clamp(Number(v), 0, 1);
      }catch{}
    }

    bumpVolume(delta){
      try{
        const v = clamp((this.video.volume || 0) + delta, 0, 1);
        this.video.volume = v;
        this.ui.setVolumeUI(v);
        this.toast.show(`الصوت: ${Math.round(v*100)}%`, 'ok', 1200);
      }catch{}
    }

    async toggleFullscreen(container){
      try{
        const el = container || document.documentElement;
        if (!document.fullscreenElement){
          await el.requestFullscreen?.();
        }else{
          await document.exitFullscreen?.();
        }
      }catch{}
    }

    async togglePiP(){
      try{
        if (!document.pictureInPictureElement){
          if (document.pictureInPictureEnabled && this.video.requestPictureInPicture){
            await this.video.requestPictureInPicture();
          }else{
            this.toast.show('PiP غير مدعوم على هذا المتصفح.', 'warn', 2200);
          }
        }else{
          await document.exitPictureInPicture?.();
        }
      }catch{
        this.toast.show('تعذر تفعيل PiP.', 'warn', 2000);
      }
    }

    // Quality actions from UI
    onQualitySelect({ mode, height, levelIndex }){
      try{
        if (!this.hls){
          this.toast.show('الجودات المتعددة متاحة فقط لقنوات HLS.', 'warn', 1600);
          return;
        }
        if (mode === 'auto'){
          this._setAutoQuality();
          return;
        }
        if (mode === 'height' && Number.isFinite(height)){
          // map height -> levelIndex (prefer exact height)
          const idx = this._findLevelIndexByHeight(Number(height));
          if (idx >= 0) this._setHlsLevelIndex(idx);
          else this.toast.show('هذه الجودة غير متاحة لهذه القناة.', 'warn', 1800);
          return;
        }
        if (Number.isFinite(levelIndex)){
          this._setHlsLevelIndex(Number(levelIndex));
        }
      }catch(err){
        console.warn('Quality select error', err);
      }
    }

    // Called by NetworkMonitor when internet is restored (no page reload)
    async onInternetRestored(){
      try{
        if (!this.currentChannel) return;

        // If paused by user, do not auto-start aggressively.
        // If paused due to buffering, safePlay helps.
        if (this.video.paused){
          await this._safePlay();
          return;
        }

        // If buffer is empty, trigger ladder step without destroy
        const buf = this.getBufferedSeconds();
        if (buf < 0.2){
          this._reconnect.requestImmediate('startLoad');
        }
      }catch{}
    }

    /******************************************************************
     * Smart Reconnect Ladder API (used by ConnectionMonitor)
     * These steps are designed to NOT cause flicker and NOT duplicate frames.
     ******************************************************************/
    async stepRecoverMediaError(){
      if (!this.hls) return false;
      try{
        // Keep last frame; do not detach
        this.hls.recoverMediaError();
        return true;
      }catch{ return false; }
    }

    async stepStartLoad(){
      if (this.hls){
        try{
          this.hls.startLoad(-1);
          return true;
        }catch{ return false; }
      }
      if (this.ts){
        try{
          // mpegts: unload+load (soft)
          this.ts.unload();
          this.ts.load();
          return true;
        }catch{ return false; }
      }
      return false;
    }

    async stepReloadPlaylist(){
      if (!this.hls) return false;
      try{
        // This triggers fresh playlist fetch without reattaching video
        this.hls.stopLoad();
        this.hls.startLoad(-1);
        return true;
      }catch{ return false; }
    }

    async stepReloadFragment(){
      // There is no direct "reload fragment" API; best practical approach:
      // Jump close to live edge to force fetching new fragments.
      try{
        const v = this.video;
        if (this.hls){
          // Try Hls liveSyncPosition first
          const p = this.hls.liveSyncPosition;
          if (Number.isFinite(p) && p > 0){
            v.currentTime = p;
            return true;
          }
        }
        // Fallback: seekable end - small epsilon
        if (v.seekable && v.seekable.length > 0){
          const end = v.seekable.end(v.seekable.length - 1);
          v.currentTime = Math.max(0, end - 0.2);
          return true;
        }
        return false;
      }catch{ return false; }
    }

    async stepReconnectSoft(){
      // Soft reconnect:
      // - For HLS: detach/attach media (may clear frame) => use freeze+overlay to prevent black/flicker
      // - For MPEGTS: detach/attach implies rebuild
      try{
        this.ui.showOverlay('إعادة الاتصال...', 'Reconnect (بدون تدمير كامل)');
        const freezeOk = this.ui.captureFreezeFrame();
        if (freezeOk) this.ui.showFreeze();

        if (this.hls){
          try{
            this.hls.stopLoad();
            this.hls.detachMedia();
            this.hls.attachMedia(this.video);
            this.hls.startLoad(-1);
            return true;
          }catch{
            return false;
          }
        }

        if (this.ts){
          try{
            // mpegts soft reconnect: unload/load
            this.ts.unload();
            this.ts.load();
            return true;
          }catch{
            return false;
          }
        }

        return false;
      }finally{
        // Keep overlay until 'playing'
      }
    }

    async stepDestroyPlayer(){
      // Destroy player instances (NOT video element) and recreate for same channel URL
      // Freeze frame avoids black screen
      try{
        if (!this.currentChannel) return false;

        this.ui.showOverlay('إصلاح متقدم...', 'Destroy + Recreate Player');
        const freezeOk = this.ui.captureFreezeFrame();
        if (freezeOk) this.ui.showFreeze();

        // Do NOT clear video element completely unless needed; but recreating pipeline requires it.
        await this._stopPlayersHard({ keepVideoElement:true });

        const type = await this.probeType(this.currentChannel.url);
        if (type === 'mpegts') await this._playMpegTs(this.currentChannel.url);
        else await this._playHls(this.currentChannel.url);

        await this._safePlay();
        return true;
      }catch{
        return false;
      }
    }

    async stepReloadChannel(){
      if (!this.currentChannel) return false;
      try{
        this.toast.show('إعادة تحميل القناة...', 'warn', 2000);
        await this.playChannel(this.currentChannel, { reason:'recovery' });
        return true;
      }catch{
        return false;
      }
    }

    destroyAll(){
      // Call on page unload if needed
      try{ this._reconnect.stop(); }catch{}
      try{ this.stopStats(); }catch{}
      this._stopPlayersHard({ keepVideoElement:true });
    }
  }

  /******************************************************************
   * ConnectionMonitor (Smarters-like Smart Reconnect Ladder)
   *
   * Goal:
   *  - Detect stalls/waiting/network errors without destroying early.
   *  - Keep last frame visible (no black, no flicker).
   *  - Escalate:
   *     RecoverMediaError
   *     -> StartLoad()
   *     -> Reload Playlist
   *     -> Reload Fragment (jump to live edge)
   *     -> Reconnect (detach/attach)
   *     -> Destroy Player (recreate instance)
   *     -> Reload Channel
   ******************************************************************/
  class ConnectionMonitor{
    constructor({ player, ui, toast }){
      this.player = player;
      this.ui = ui;
      this.toast = toast;

      this._timer = null;

      // Playback progress tracking
      this._lastTime = 0;
      this._lastProgressAt = 0;

      // Reconnect state
      this._busy = false;
      this._stage = 0;
      this._signals = new Set();

      // Immediate request queue (e.g., fatal error)
      this._immediate = null;

      // Backoff
      this._lastActionAt = 0;
    }

    start(){
      this.stop();
      this.reset();
      this._timer = setInterval(() => this._tick(), 1000);
    }

    stop(){
      if (this._timer) clearInterval(this._timer);
      this._timer = null;
    }

    reset(){
      this._busy = false;
      this._stage = 0;
      this._signals.clear();
      this._lastTime = this.player.video.currentTime || 0;
      const now = performance.now();
      this._lastProgressAt = now;
      this._lastActionAt = 0;
      this._immediate = null;
    }

    onPlaying(){
      // When playback resumes, clear recovery state
      this.reset();
    }

    onTimeUpdate(){
      const v = this.player.video;
      const t = v.currentTime || 0;
      if (t > this._lastTime + 0.03){
        this._lastTime = t;
        this._lastProgressAt = performance.now();
        // If we're reconnecting, let it settle
      }
    }

    onSignal(name){
      // waiting/stalled/errors -> mark signal
      this._signals.add(String(name));
    }

    onHlsError({ type, details, fatal }){
      // Mark signals but do not immediately destroy
      const k = `hls:${type}:${details}:${fatal ? 'fatal' : 'nf'}`;
      this._signals.add(k);

      // Common important details
      const d = String(details||'');
      if (d.includes('FRAG_LOAD') || d.includes('LEVEL_LOAD') || d.includes('MANIFEST_LOAD')){
        this._signals.add('hls_network_issue');
      }
      if (String(type||'').includes('MEDIA')){
        this._signals.add('hls_media_issue');
      }
    }

    requestImmediate(stepName){
      // Schedule immediate step (but still serialized and safe)
      this._immediate = stepName;
    }

    async _tick(){
      const v = this.player.video;

      // If no channel, skip
      if (!this.player.currentChannel) return;

      // If user paused intentionally, do not auto-reconnect aggressively
      if (v.paused){
        this._signals.clear();
        return;
      }

      // If offline: keep last frame; show overlay but do nothing until online
      if (!navigator.onLine){
        this.ui.showOverlay('بانتظار الإنترنت...', 'Offline');
        return;
      }

      // Determine stall: no progress for N seconds AND buffer low OR waiting signals
      const now = performance.now();
      const noProgressSec = (now - this._lastProgressAt) / 1000;
      const bufSec = this.player.getBufferedSeconds();
      const likelyStalled = (noProgressSec >= 3.2 && (v.readyState < 3 || bufSec < 0.25)) || this._signals.has('waiting') || this._signals.has('stalled');

      // Immediate requests (fatal)
      if (this._immediate && !this._busy){
        const s = this._immediate;
        this._immediate = null;
        await this._runImmediate(s);
        return;
      }

      if (!likelyStalled){
        // Healthy
        if (this.ui.overlay.classList.contains('show')) this.ui.hideOverlay();
        this._signals.clear();
        return;
      }

      // If already busy performing an action, wait
      if (this._busy) return;

      // Small backoff to avoid spamming actions each second
      if (this._lastActionAt && (now - this._lastActionAt) < 1800) return;

      // Begin ladder
      this._busy = true;
      this._lastActionAt = now;

      try{
        this.ui.showOverlay('جاري إعادة الاتصال...', 'Buffering / Reconnecting (يحافظ على آخر Frame)');
        const ok = await this._escalate();
        if (!ok){
          // If all steps failed, keep overlay and let next ticks try reload channel
          this.toast.show('فشل الإصلاح مؤقتاً. سيتم المحاولة مجدداً...', 'bad', 2600);
        }
      }catch(err){
        console.warn('Reconnect ladder error', err);
      }finally{
        this._busy = false;
      }
    }

    async _runImmediate(stepName){
      this._busy = true;
      try{
        this.ui.showOverlay('إصلاح فوري...', stepName);
        const ok = await this._runStepByName(stepName);
        if (!ok) await this._escalate(); // fallback
      }finally{
        this._busy = false;
      }
    }

    async _escalate(){
      // Stage progression:
      // 0 recoverMediaError
      // 1 startLoad
      // 2 reloadPlaylist
      // 3 reloadFragment
      // 4 reconnectSoft
      // 5 destroyPlayer
      // 6 reloadChannel
      const stages = [
        { name:'recoverMediaError', title:'إصلاح Media...', msg:'RecoverMediaError' },
        { name:'startLoad', title:'إعادة تحميل...', msg:'StartLoad()' },
        { name:'reloadPlaylist', title:'تحديث Playlist...', msg:'Reload Playlist' },
        { name:'reloadFragment', title:'تحديث Fragment...', msg:'Reload Fragment (Live jump)' },
        { name:'reconnectSoft', title:'إعادة الاتصال...', msg:'Reconnect' },
        { name:'destroyPlayer', title:'إصلاح متقدم...', msg:'Destroy Player' },
        { name:'reloadChannel', title:'إعادة تحميل القناة...', msg:'Reload Channel' }
      ];

      // Start from current stage and go forward
      for (let i=this._stage; i<stages.length; i++){
        const s = stages[i];
        this.ui.showOverlay(s.title, s.msg);

        // Very important: do not clear <video> for early steps.
        const ok = await this._runStepByName(s.name);

        if (ok){
          this._stage = i + 1; // next time start higher if it stalls again
          // Try play again (non-blocking)
          this.player.video.play().catch(()=>{});
          // Keep overlay until 'playing' event
          this.toast.show(`Reconnect: ${s.msg}`, 'warn', 1600);
          this._signals.clear();
          return true;
        }
      }

      return false;
    }

    async _runStepByName(name){
      switch(name){
        case 'recoverMediaError': return await this.player.stepRecoverMediaError();
        case 'startLoad': return await this.player.stepStartLoad();
        case 'reloadPlaylist': return await this.player.stepReloadPlaylist();
        case 'reloadFragment': return await this.player.stepReloadFragment();
        case 'reconnectSoft': return await this.player.stepReconnectSoft();
        case 'destroyPlayer': return await this.player.stepDestroyPlayer();
        case 'reloadChannel': return await this.player.stepReloadChannel();
        default: return false;
      }
    }
  }

  /******************************************************************
   * App
   ******************************************************************/
  class App{
    constructor(){
      this.storage = new StorageManager();
      this.cm = new ChannelManager();
      this.toast = new ToastManager($('#toasts'));

      this.ui = new UIManager({ toast: this.toast });
      this.player = new PlayerManager({
        video: this.ui.video,
        ui: this.ui,
        toast: this.toast,
        storage: this.storage
      });

      this.net = new NetworkMonitor({ ui: this.ui, toast: this.toast, player: this.player });

      this.favorites = this.storage.getFavorites();
      this.activeId = '';
    }

    async start(){
      // Global error boundary
      window.addEventListener('error', (e) => {
        console.warn('Global error', e?.error || e?.message || e);
        this.toast.show('حدث خطأ غير متوقع (تم تجاهله للحفاظ على التشغيل).', 'warn', 2200);
      });
      window.addEventListener('unhandledrejection', (e) => {
        console.warn('Unhandled rejection', e?.reason || e);
        this.toast.show('خطأ غير متوقع في الخلفية (تم تجاهله).', 'warn', 2200);
      });

      // Wait for libs
      this.ui.showOverlay('جاري التحضير...', 'تحميل مكتبات المشغل');
      const libsOk = await waitForLibs(9000);
      if (!libsOk){
        this.toast.show('تعذر تحميل HLS.js / mpegts.js. تحقق من اتصال الإنترنت.', 'bad', 4200);
      }

      // Bind UI handlers (event delegation, no memory leaks)
      this._bindUI();

      // Start network monitor
      this.net.start();

      // Load channels
      await this.reloadChannels();

      // Resume last channel
      const last = this.storage.getLastChannelId();
      const ch = last ? this.cm.getById(last) : (this.cm.channels[0] || null);
      if (ch){
        await this.openChannel(ch, { reason:'resume' });
      }else{
        this.ui.showOverlay('لا توجد قنوات', 'تحقق من /api/m3u/default');
      }
    }

    _bindUI(){
      // Tabs
      const setTab = (tab) => {
        this.ui.currentTab = tab;
        for (const b of [this.ui.tabAll, this.ui.tabFav, this.ui.tabRecent]){
          b.classList.toggle('active', b.dataset.tab === tab);
        }
        this.renderList();
      };

      this.ui.tabAll.addEventListener('click', () => setTab('all'));
      this.ui.tabFav.addEventListener('click', () => setTab('fav'));
      this.ui.tabRecent.addEventListener('click', () => setTab('recent'));

      // Search (fast, raf-batched)
      this.ui.searchInput.addEventListener('input', () => {
        this.ui.currentQuery = this.ui.searchInput.value;
        this.renderList();
      }, { passive:true });

      // Sort
      this.ui.sortSel.addEventListener('change', () => {
        this.ui.sortMode = this.ui.sortSel.value;
        this.renderList();
      });

      // Reload list
      this.ui.btnReload.addEventListener('click', async () => {
        await this.reloadChannels();
      });

      // List event delegation (single listener, no leaks)
      this.ui.listEl.addEventListener('click', async (e) => {
        const favBtn = e.target.closest('[data-fav="1"]');
        const item = e.target.closest('.item');
        if (!item) return;

        const id = item.dataset.id;
        if (!id) return;

        if (favBtn){
          this.toggleFavorite(id);
          return;
        }

        const ch = this.cm.getById(id);
        if (ch) await this.openChannel(ch, { reason:'user' });
      });

      // Keyboard navigation on list (TV remotes)
      this.ui.listEl.addEventListener('keydown', async (e) => {
        if (e.key === 'ArrowDown'){
          e.preventDefault();
          this.ui.focusNext();
        } else if (e.key === 'ArrowUp'){
          e.preventDefault();
          this.ui.focusPrev();
        } else if (e.key === 'Enter'){
          e.preventDefault();
          const id = document.activeElement?.dataset?.id;
          const ch = id ? this.cm.getById(id) : null;
          if (ch) await this.openChannel(ch, { reason:'user' });
        }
      });

      // Player controls
      this.ui.btnPlay.addEventListener('click', () => this.player.togglePlay());
      this.ui.btnMute.addEventListener('click', () => this.player.toggleMute());

      this.ui.volRange.addEventListener('input', () => {
        const v = clamp(Number(this.ui.volRange.value) / 100, 0, 1);
        this.player.setVolume(v);
        this.ui.setVolumeUI(v);
      }, { passive:true });

      this.ui.btnFull.addEventListener('click', () => this.player.toggleFullscreen(this.ui.playerWrap));
      this.ui.btnPiP.addEventListener('click', () => this.player.togglePiP());

      // Quality menu open/close
      this.ui.btnQuality.addEventListener('click', () => {
        if (!this.player.hls){
          this.toast.show('Quality متاح فقط لقنوات HLS.', 'warn', 1600);
          return;
        }
        // Build fresh state in case levels updated
        this.ui.buildQualityMenu({ levels: this.player.levels, activeMode: this.storage.getQualityPref() });
        this.ui.toggleQualityMenu();
      });

      // Close quality menu when clicking outside
      document.addEventListener('click', (e) => {
        if (!this.ui.qMenu.classList.contains('show')) return;
        const inside = this.ui.qMenu.contains(e.target) || this.ui.btnQuality.contains(e.target);
        if (!inside) this.ui.hideQualityMenu();
      }, { passive:true });

      // Quality selection delegation
      this.ui.qMenu.addEventListener('click', (e) => {
        const mi = e.target.closest('.mi');
        if (!mi) return;
        const qkey = mi.dataset.qkey || '';
        if (qkey === 'auto'){
          this.player.onQualitySelect({ mode:'auto' });
          this.ui.hideQualityMenu();
          return;
        }
        const height = Number(mi.dataset.height || 0);
        const levelIndex = Number(mi.dataset.level || -1);
        if (height > 0){
          this.player.onQualitySelect({ mode:'height', height });
        }else if (Number.isFinite(levelIndex) && levelIndex >= 0){
          this.player.onQualitySelect({ levelIndex });
        }
        this.ui.hideQualityMenu();
      });

      // Bottom favorite toggle
      this.ui.btnFavToggle.addEventListener('click', () => {
        if (!this.activeId) return;
        this.toggleFavorite(this.activeId);
      });

      // Keyboard shortcuts (Smarters-like)
      document.addEventListener('keydown', async (e) => {
        // ignore when typing
        const ae = document.activeElement;
        const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
        if (typing) return;

        const k = e.key;

        if (k === ' ' || e.code === 'Space'){
          e.preventDefault();
          this.player.togglePlay();
          return;
        }
        if (k.toLowerCase() === 'm'){
          this.player.toggleMute();
          return;
        }
        if (k.toLowerCase() === 'f'){
          await this.player.toggleFullscreen(this.ui.playerWrap);
          return;
        }
        if (k === 'ArrowUp'){
          e.preventDefault();
          this.player.bumpVolume(+0.05);
          return;
        }
        if (k === 'ArrowDown'){
          e.preventDefault();
          this.player.bumpVolume(-0.05);
          return;
        }
        if (k === 'PageUp'){
          e.preventDefault();
          await this.openPrevChannel();
          return;
        }
        if (k === 'PageDown'){
          e.preventDefault();
          await this.openNextChannel();
          return;
        }
      });
    }

    async reloadChannels(){
      try{
        this.ui.showOverlay('جاري تحميل القنوات...', 'قراءة /api/m3u/default');
        const channels = await this.cm.load();

        this.ui.chCount.textContent = String(channels.length);

        // Ensure nodes exist (reused)
        this.ui.ensureChannelNodes(channels, this.favorites);

        this.toast.show('تم تحميل قائمة القنوات.', 'ok', 1600);

        // Render list according to current filters
        this.renderList();

        // Hide overlay if we aren't playing yet (player will hide on playing)
        if (!this.player.currentChannel) this.ui.hideOverlay();
      }catch(err){
        this.ui.showOverlay('فشل تحميل القائمة', String(err?.message || err));
        this.toast.show('فشل تحميل قائمة القنوات.', 'bad', 2800);
      }
    }

    renderList(){
      try{
        const recent = this.storage.getRecent();
        this.ui.renderChannelListView({
          channels: this.cm.channels,
          favoritesSet: this.favorites,
          recentIds: recent,
          tab: this.ui.currentTab,
          query: this.ui.currentQuery,
          sortMode: this.ui.sortMode,
          activeId: this.activeId
        });
      }catch(err){
        console.warn('Render list error', err);
      }
    }

    toggleFavorite(id){
      try{
        if (this.favorites.has(id)){
          this.favorites.delete(id);
          this.toast.show('تمت الإزالة من المفضلة', 'ok', 1500);
        }else{
          this.favorites.add(id);
          this.toast.show('تمت الإضافة إلى المفضلة', 'ok', 1500);
        }
        this.storage.setFavorites(this.favorites);

        // Update visuals only (no full render needed)
        this.ui.updateFavoriteVisual(id, this.favorites.has(id));

        // Update bottom button text
        const ch = this.cm.getById(id);
        if (ch && id === this.activeId){
          this.ui.setChannelInfo(ch, this.favorites.has(id));
        }

        // If we are in favorites tab, refresh view (reusing nodes)
        if (this.ui.currentTab === 'fav'){
          this.renderList();
        }
      }catch(err){
        console.warn('Favorite toggle error', err);
      }
    }

    async openChannel(ch, { reason='user' } = {}){
      try{
        this.activeId = ch.id;

        // Persist last channel + recent
        this.storage.setLastChannelId(ch.id);
        this.storage.pushRecent(ch.id);

        // Update UI early (no black)
        this.ui.setChannelInfo(ch, this.favorites.has(ch.id));
        this.ui.setActiveInList(ch.id);

        // Play (player handles freeze + hard stop)
        await this.player.playChannel(ch, { reason });

        // Update list view (recent tab ordering etc.)
        this.renderList();
      }catch(err){
        console.warn('Open channel error', err);
        this.toast.show('تعذر تشغيل القناة. سيتم المحاولة تلقائياً.', 'bad', 2600);
      }
    }

    async openNextChannel(){
      const visible = this.ui.getVisibleIds();
      if (!visible.length) return;
      const idx = visible.indexOf(this.activeId);
      const nextId = visible[(idx >= 0 ? idx + 1 : 0) % visible.length];
      const ch = this.cm.getById(nextId);
      if (ch) await this.openChannel(ch, { reason:'user' });
    }

    async openPrevChannel(){
      const visible = this.ui.getVisibleIds();
      if (!visible.length) return;
      const idx = visible.indexOf(this.activeId);
      const prevId = visible[(idx >= 0 ? (idx - 1 + visible.length) : 0) % visible.length];
      const ch = this.cm.getById(prevId);
      if (ch) await this.openChannel(ch, { reason:'user' });
    }
  }

  /******************************************************************
   * Boot
   ******************************************************************/
  const app = new App();

  // Ensure cleanup to prevent memory leaks
  window.addEventListener('beforeunload', () => {
    try{ app.net.stop(); }catch{}
    try{ app.player.destroyAll(); }catch{}
  });

  app.start();

})();
</script>
</body>
</html>
