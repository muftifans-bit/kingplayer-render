<!--
  File: data/player_v2.html
  IPTV Player v2 (Vanilla JS) - Smarters-like UI/UX
  Requirements:
   - DO NOT change backend or endpoints:
      GET /api/m3u/default
      GET /api/stream/probe
      GET /api/stream/proxy
   - Only libraries: HLS.js, mpegts.js
   - No frameworks, no jQuery, no Bootstrap

  Notes:
   - Single <video> element is reused دائمًا (لا يتم إعادة إنشائه إلا عند الضرورة القصوى).
   - أثناء إعادة الاتصال: نحافظ على آخر Frame ظاهر (بدون شاشة سوداء/وميض).
   - عند تغيير القناة: نلتقط Freeze Frame (Canvas) لتجنب flicker عند تفريغ الـ MSE.
-->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>IPTV Player v2</title>

  <!-- Allowed libraries only -->
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

  <style>
    :root{
      --bg0:#070A0F;
      --bg1:#0B1020;
      --glass: rgba(12, 18, 40, .62);
      --glass2: rgba(12, 18, 40, .78);
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.045);
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.16);

      --text:#EAF0FF;
      --muted: rgba(234,240,255,.72);
      --muted2: rgba(234,240,255,.56);

      --brand:#5DA7FF;
      --brand2:#8A5DFF;
      --good:#27D17F;
      --warn:#FFCA3A;
      --bad:#FF4D6D;

      --shadow: 0 18px 60px rgba(0,0,0,.52);
      --shadow2: 0 10px 26px rgba(0,0,0,.38);
      --radius: 18px;
      --radius2: 14px;

      --headerH: 66px;
      --bottomH: 74px;
      --sidebarW: 372px;

      --font: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans Arabic", "Noto Sans", sans-serif;
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 15% -10%, rgba(93,167,255,.17), transparent 60%),
        radial-gradient(900px 520px at 115% 5%, rgba(138,93,255,.14), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow:hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar{ width:10px; height:10px; }
    ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:999px; }
    ::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.18); }

    /* Layout */
    .app{ height:100%; display:flex; flex-direction:column; }

    header{
      height:var(--headerH);
      padding: 10px 12px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:space-between;
      border-bottom:1px solid var(--stroke);
      background: rgba(10,14,28,.70);
      backdrop-filter: blur(14px);
    }

    .brand{
      display:flex; align-items:center; gap:10px;
      min-width: 240px;
      user-select:none;
    }
    .brand-badge{
      width:42px; height:42px;
      border-radius: 14px;
      background:
        radial-gradient(16px 16px at 28% 22%, rgba(255,255,255,.22), transparent 60%),
        linear-gradient(135deg, rgba(93,167,255,.95), rgba(138,93,255,.95));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 16px 30px rgba(93,167,255,.12);
      display:flex; align-items:center; justify-content:center;
      flex: 0 0 auto;
    }
    .brand-badge svg{ width:22px; height:22px; opacity:.95; }
    .brand-title{ min-width:0; }
    .brand-title .t1{ font-size:14px; font-weight:900; letter-spacing:.2px; line-height:1.1; }
    .brand-title .t2{
      font-size:12px;
      color: var(--muted2);
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 330px;
    }

    .header-center{
      flex: 1;
      display:flex;
      align-items:center;
      gap:10px;
      max-width: 980px;
      min-width: 280px;
    }

    .search{
      flex: 1;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      border:1px solid var(--stroke);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      min-width: 220px;
    }
    .search svg{ width:18px; height:18px; opacity:.85; }
    .search input{
      width:100%;
      background: transparent;
      border:0;
      outline:0;
      color: var(--text);
      font-size:14px;
    }
    .search input::placeholder{ color: rgba(234,240,255,.45); }

    .tabs{
      display:flex;
      align-items:center;
      gap:8px;
      padding: 6px;
      border-radius: 16px;
      background: rgba(255,255,255,.04);
      border:1px solid var(--stroke);
    }
    .tab{
      border:0;
      cursor:pointer;
      user-select:none;
      color: var(--muted);
      background: transparent;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      display:flex;
      align-items:center;
      gap:8px;
      transition: background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
    }
    .tab svg{ width:16px; height:16px; opacity:.92; }
    .tab:hover{ background: rgba(255,255,255,.06); }
    .tab:active{ transform: translateY(1px); }
    .tab.active{
      background: rgba(93,167,255,.14);
      color: var(--text);
      border:1px solid rgba(93,167,255,.20);
    }
    .tab:focus-visible{ outline:2px solid rgba(93,167,255,.45); outline-offset:2px; }

    .header-right{
      display:flex;
      align-items:center;
      gap:10px;
      justify-content:flex-end;
      min-width: 320px;
    }

    .pill{
      display:flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      font-size: 12px;
      color: var(--muted);
      user-select:none;
      white-space:nowrap;
    }
    .pill strong{ color: rgba(234,240,255,.92); font-weight:900; }
    .dot{
      width:8px; height:8px; border-radius:50%;
      background: rgba(255,255,255,.5);
      box-shadow: 0 0 0 5px rgba(255,255,255,.06);
    }
    .dot.online{ background: var(--good); box-shadow: 0 0 0 5px rgba(39,209,127,.12); }
    .dot.offline{ background: var(--bad); box-shadow: 0 0 0 5px rgba(255,77,109,.14); }

    /* Main */
    .main{
      flex: 1;
      min-height:0;
      display:flex;
    }

    /* Sidebar */
    aside{
      width: var(--sidebarW);
      min-height:0;
      display:flex;
      flex-direction:column;
      border-left: 1px solid var(--stroke);
      background: rgba(8,12,24,.62);
      backdrop-filter: blur(16px);
    }

    .side-top{
      padding: 12px;
      border-bottom:1px solid var(--stroke);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .side-top .meta{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .side-top .meta .c1{ font-size:12px; color: var(--muted2); }
    .side-top .meta .c2{ font-size:12px; color: rgba(234,240,255,.70); }

    .btn{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.05);
      color: rgba(234,240,255,.92);
      border-radius: 14px;
      padding: 9px 10px;
      font-size: 12px;
      cursor:pointer;
      user-select:none;
      transition: background .16s var(--ease), transform .12s var(--ease), border-color .16s var(--ease);
      display:flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{ background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); }
    .btn:active{ transform: translateY(1px); }
    .btn:focus-visible{ outline:2px solid rgba(93,167,255,.45); outline-offset:2px; }
    .btn svg{ width:16px; height:16px; opacity:.92; }

    .side-tools{
      padding: 10px 12px;
      display:flex;
      gap:10px;
      align-items:center;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .select{
      flex:1;
      display:flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 14px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.04);
    }
    .select label{ font-size:12px; color: var(--muted2); }
    .select select{
      flex:1;
      background: transparent;
      color: rgba(234,240,255,.92);
      border:0;
      outline:0;
      font-size: 12px;
    }

    .list{
      flex:1;
      min-height:0;
      overflow:auto;
      padding: 10px;
    }

    .group{
      margin: 10px 0;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
      border-radius: 16px;
      overflow:hidden;
    }
    .group-h{
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.14);
    }
    .group-h .name{
      font-size: 12px;
      color: rgba(234,240,255,.72);
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .group-h .count{
      font-size: 12px;
      color: rgba(234,240,255,.55);
    }

    .item{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 10px;
      cursor:pointer;
      user-select:none;
      border-top: 1px solid rgba(255,255,255,.05);
      background: rgba(255,255,255,.00);
      outline:none;
      transition: background .16s var(--ease);
    }
    .item:first-child{ border-top:0; }
    .item:hover{ background: rgba(255,255,255,.05); }
    .item.active{
      background: rgba(93,167,255,.12);
    }
    .item:focus-visible{
      outline:2px solid rgba(93,167,255,.45);
      outline-offset: -2px;
    }

    .logo{
      width:44px; height:44px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(18px 18px at 28% 22%, rgba(255,255,255,.12), transparent 60%),
        linear-gradient(135deg, rgba(93,167,255,.14), rgba(138,93,255,.12));
      overflow:hidden;
      flex: 0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .ph{
      width:100%; height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 1000;
      letter-spacing:.4px;
      color: rgba(255,255,255,.92);
      background:
        radial-gradient(18px 18px at 28% 22%, rgba(255,255,255,.14), transparent 60%),
        linear-gradient(135deg, rgba(93,167,255,.30), rgba(138,93,255,.25));
    }

    .meta{
      flex:1;
      min-width:0;
    }
    .meta .n{
      font-size: 14px;
      color: rgba(234,240,255,.95);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .meta .g{
      margin-top:3px;
      font-size: 12px;
      color: rgba(234,240,255,.55);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
    }
    .fav{
      width:34px; height:34px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition: transform .12s var(--ease), background .14s var(--ease), border-color .14s var(--ease);
    }
    .fav:hover{ background: rgba(255,255,255,.07); }
    .fav:active{ transform: translateY(1px); }
    .fav.on{
      border-color: rgba(255,202,58,.22);
      background: rgba(255,202,58,.10);
    }
    .fav svg{ width:16px; height:16px; opacity:.95; }

    /* Content / Player */
    .content{
      flex:1;
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .player{
      flex:1;
      min-height:0;
      margin: 12px;
      border-radius: var(--radius);
      overflow:hidden;
      position:relative;
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(900px 500px at 10% 0%, rgba(93,167,255,.10), transparent 55%),
        radial-gradient(800px 450px at 110% 10%, rgba(138,93,255,.10), transparent 55%),
        rgba(0,0,0,.40);
      box-shadow: var(--shadow);
    }

    video#video{
      width:100%;
      height:100%;
      background:#000;
      display:block;
      object-fit: contain;
    }

    /* Freeze frame canvas - used ONLY when we must clear/detach MSE to prevent flicker/black */
    .freeze{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:none;
      z-index: 2;
      background: #000;
    }
    .freeze.show{ display:block; }

    /* Top overlay (Smarters-like badges) */
    .top-overlay{
      position:absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      z-index: 5;
      pointer-events:none;
    }
    .badges{
      display:flex;
      align-items:center;
      gap:10px;
      pointer-events:none;
    }
    .badge{
      display:flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow2);
      font-size: 12px;
      color: rgba(234,240,255,.88);
    }
    .live{
      border-color: rgba(255,77,109,.28);
      background: rgba(255,77,109,.14);
      font-weight: 1000;
      letter-spacing:.25px;
      text-transform: uppercase;
      color: rgba(255,255,255,.95);
    }
    .live .ld{
      width:8px; height:8px; border-radius:50%;
      background: var(--bad);
      box-shadow: 0 0 0 6px rgba(255,77,109,.12);
    }

    .channel-mini{
      max-width: 48vw;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 8px 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow2);
      pointer-events:none;
    }
    .channel-mini .mini-logo{
      width:34px; height:34px;
      border-radius: 12px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      display:flex; align-items:center; justify-content:center;
      flex:0 0 auto;
    }
    .channel-mini .mini-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .channel-mini .txt{ min-width:0; }
    .channel-mini .txt .n{
      font-size: 13px;
      font-weight: 900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .channel-mini .txt .g{
      margin-top:2px;
      font-size: 12px;
      color: rgba(234,240,255,.58);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Bottom overlay controls */
    .controls{
      position:absolute;
      left: 0; right: 0; bottom: 0;
      padding: 12px 12px 12px;
      z-index: 6;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.46) 42%, rgba(0,0,0,.72) 100%);
      pointer-events:auto;
      opacity: 1;
      transition: opacity .18s var(--ease), transform .18s var(--ease);
    }
    .controls.hide{
      opacity: 0;
      transform: translateY(8px);
      pointer-events:none;
    }

    .ctrl-l, .ctrl-r{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .icbtn{
      width:44px; height:44px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      transition: transform .12s var(--ease), background .16s var(--ease), border-color .16s var(--ease);
    }
    .icbtn:hover{ background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.16); }
    .icbtn:active{ transform: translateY(1px); }
    .icbtn:focus-visible{ outline:2px solid rgba(93,167,255,.45); outline-offset:2px; }
    .icbtn svg{ width:18px; height:18px; opacity:.95; }

    .vol{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      min-width: 220px;
    }
    .vol label{ font-size:12px; color: rgba(234,240,255,.78); font-weight:800; }
    .vol .val{ font-size:12px; color: rgba(234,240,255,.72); width:40px; text-align:left; }

    input[type="range"]{
      -webkit-appearance:none;
      appearance:none;
      height: 4px;
      width: 140px;
      background: rgba(255,255,255,.20);
      border-radius: 999px;
      outline:none;
    }
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;
      appearance:none;
      width:16px; height:16px;
      border-radius: 50%;
      background: rgba(93,167,255,.96);
      border: 2px solid rgba(255,255,255,.20);
      box-shadow: 0 10px 26px rgba(93,167,255,.16);
    }

    /* Quality menu */
    .qwrap{ position:relative; }
    .menu{
      position:absolute;
      bottom: 54px;
      left: 0;
      min-width: 220px;
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(10,14,28,.92);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      display:none;
      z-index: 30;
    }
    .menu.show{ display:block; }
    .mi{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 11px 12px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      cursor:pointer;
      user-select:none;
      font-size: 13px;
      color: rgba(234,240,255,.90);
    }
    .mi:last-child{ border-bottom:0; }
    .mi:hover{ background: rgba(255,255,255,.06); }
    .mi.active{ background: rgba(93,167,255,.12); }
    .mi .tag{
      font-size: 11px;
      color: rgba(234,240,255,.58);
    }

    /* Loading overlay (transparent: keeps last video frame visible) */
    .overlay{
      position:absolute;
      inset:0;
      z-index: 8;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      opacity: 0;
      transition: opacity .18s var(--ease);
    }
    .overlay.show{ opacity: 1; }
    .overlay .panel{
      pointer-events:none;
      padding: 14px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(10,14,28,.62);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      gap:12px;
      max-width: min(620px, 92vw);
    }
    .spin{
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.14);
      border-top-color: rgba(93,167,255,.96);
      animation: spin .9s linear infinite;
      flex: 0 0 auto;
    }
    @keyframes spin{ to{ transform: rotate(360deg);} }
    .overlay .txt{ min-width:0; }
    .overlay .txt .t{
      font-size: 14px;
      font-weight: 1000;
      color: rgba(234,240,255,.96);
      letter-spacing:.2px;
    }
    .overlay .txt .m{
      margin-top:3px;
      font-size: 12px;
      color: rgba(234,240,255,.66);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Bottom info bar */
    .bottom{
      height: var(--bottomH);
      padding: 10px 12px;
      border-top:1px solid var(--stroke);
      background: rgba(10,14,28,.70);
      backdrop-filter: blur(14px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .b-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex:1;
    }
    .b-logo{
      width:46px; height:46px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }
    .b-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .b-meta{ min-width:0; }
    .b-meta .title{
      font-size: 14px;
      font-weight: 1000;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .b-meta .sub{
      margin-top:2px;
      font-size: 12px;
      color: rgba(234,240,255,.56);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .b-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
    }

    .stats{
      display:flex;
      align-items:center;
      gap:8px;
      justify-content:flex-end;
      flex-wrap:wrap;
      min-width: 520px;
    }
    .stat{
      font-size: 12px;
      color: rgba(234,240,255,.78);
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      white-space:nowrap;
      user-select:none;
    }
    .stat strong{ color: rgba(234,240,255,.95); font-weight:1000; }

    /* Toasts */
    .toasts{
      position: fixed;
      top: calc(var(--headerH) + 12px);
      right: 12px;
      z-index: 120;
      display:flex;
      flex-direction:column;
      gap: 10px;
      pointer-events:none;
    }
    .toast{
      pointer-events:none;
      max-width: min(560px, 92vw);
      padding: 12px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(10,14,28,.88);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow2);
      color: rgba(234,240,255,.92);
      font-size: 13px;
      transform: translateY(-8px);
      opacity: 0;
      transition: transform .22s var(--ease), opacity .22s var(--ease);
    }
    .toast.show{ transform: translateY(0); opacity: 1; }
    .toast.ok{ border-color: rgba(39,209,127,.22); }
    .toast.warn{ border-color: rgba(255,202,58,.22); }
    .toast.bad{ border-color: rgba(255,77,109,.22); }

    /* Responsive */
    @media (max-width: 1050px){
      :root{ --sidebarW: 340px; }
      .stats{ min-width: 360px; }
    }
    @media (max-width: 900px){
      .tabs{ display:none; }
      .header-right{ min-width: 220px; }
      .stats{ display:none; }
    }
    @media (max-width: 820px){
      aside{ display:none; }
      .brand-title .t2{ display:none; }
      .header-right{ display:none; }
    }
  </style>
</head>
